---
#
# Deploy the OpenSearch stack (OpenSearch + OpenSearch Dashboards) for LLM
# request-plane observability. Replaces the former Elasticsearch 9 + Kibana 9
# stack in place: the play first purges the Elastic packages (guarded — no-op
# on a fresh VM), then installs and configures the OpenSearch 2.x bundle.
#
# The data is a 14-day rolling window of transient logs (ISM delete), so a
# short gap during the migration is accepted by design — ES 9 snapshots are
# not readable by OpenSearch and remote reindex from ES 9 is not supported.
#
# Endpoints (same as before — Filebeat on the LLM/nginx VMs needs no change):
#   OpenSearch Dashboards :5601
#   OpenSearch            :9200 (LAN IP only)
#
# Security is DISABLED (plugins.security.disabled=true): consistent with the
# rest of the lab (Prometheus, node_exporter, llama /metrics are all
# unauthenticated on the trusted LAN). Re-enable before exposing beyond
# 192.168.51.0/24.
#
# Ingestion is server-side: the index template sets index.default_pipeline,
# so the shippers send raw lines and OpenSearch parses/normalizes. (Fluent
# Bit keeps setup.template/ilm=false — see modules/nginx/ansible.yml.)
#
# Dashboards are classic saved objects (data views + TSVB line/area charts +
# dashboards) imported as NDJSON via
# POST /api/saved_objects/_import?overwrite=true — idempotent by design.
# The chart definitions live in dashboards/*.json; the .ndjson files are
# generated locally with dashboards/generate_ods_objects.py and committed.
#

- name: Deploy OpenSearch stack (OpenSearch + Dashboards) for LLM observability
  hosts: elk
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # es_ip: terraform passes it via extra_vars (proxmox.tfvars)

    # Indices: llm-logs-YYYY.MM.dd (LLM log shipping removed 2026-09-08 —
    # no new indices will appear; existing ones age out under the policy).
    # 14-day retention, then delete.
    # OpenSearch 2.x has NO ES-style ILM API (the /_ilm handlers do not
    # exist in the 2.19 index-management plugin) — retention is done with
    # ISM policies under /_plugins/_ism. The index template attaches the
    # policy via index.plugins.index_state_management.policy_id; ISM's
    # coordinator sweep manages new matching indices within ~5-10m.
    # Semantics match the ES 9 stack this replaces: hot immediately,
    # delete once the index is 14 days old.
    llm_ism_policy:
      policy:
        description: llm-logs 14-day retention (was ES 9 ILM policy)
        default_state: hot
        # auto-manage any NEW index matching the pattern on the next
        # coordinator sweep (deterministic, vs. relying on the settings
        # policy_id scan); combined with the template setting below
        ism_template:
          index_patterns:
            - llm-logs-*
        states:
          - name: hot
            actions: []
            transitions:
              - state_name: delete
                conditions:
                  min_index_age: 14d
          - name: delete
            actions:
              - delete: {}
            transitions: []

    index_template:
      index_patterns:
        - llm-logs-*
      priority: 200
      template:
        settings:
          index.number_of_shards: 1
          index.number_of_replicas: 0
          index.plugins.index_state_management.policy_id: llm-logs-14d
          # every doc goes through the parser; the grok processors are
          # guarded and no-op on non-matching lines
          index.default_pipeline: llama-logs
        mappings:
          # 'instance' is the llama-server port (8001-8004), added by the
          # per-port Fluent Bit filters on the LLM VM (LLM log shipping
          # removed 2026-09-08). It was the join key with nginx-access
          # upstream_addr (the llm_pool round-robin target).
          properties:
            instance:
              type: keyword

    # Indices: Fluent Bit on the nginx VM ships the JSON access log into
    # nginx-access-YYYY.MM.dd and the captured request/response bodies of the
    # LLM API into nginx-body-YYYY.MM.dd (see modules/nginx/ansible.yml).
    nginx_ism_policy:
      policy:
        description: nginx access/body 14-day retention (was ES 9 ILM policy)
        default_state: hot
        ism_template:
          index_patterns:
            - nginx-access-*
            - nginx-body-*
        states:
          - name: hot
            actions: []
            transitions:
              - state_name: delete
                conditions:
                  min_index_age: 14d
          - name: delete
            actions:
              - delete: {}
            transitions: []

    nginx_index_template:
      index_patterns:
        - nginx-access-*
      priority: 200
      template:
        settings:
          index.number_of_shards: 1
          index.number_of_replicas: 0
          index.plugins.index_state_management.policy_id: nginx-access-14d
        mappings:
          # Fluent Bit ships the json_analytics values as STRINGS; numeric
          # fields are coerced here (the "" upstream_response_time for the
          # default vhost is dropped via ignore_malformed). Everything else
          # stays dynamic (keyword).
          properties:
            status:
              type: long
              ignore_malformed: true
            body_bytes_sent:
              type: long
              ignore_malformed: true
            request_time:
              type: double
              ignore_malformed: true
            upstream_response_time:
              type: double
              ignore_malformed: true

    # Request/response bodies captured by the lua module on the nginx proxy
    # for LLM JSON API calls (modules/nginx/ansible.yml). request_id matches
    # the nginx-access-* analytics record of the same proxied request. The
    # bodies are mapped as full-text (searchable) without keyword subfields,
    # so multi-MB payloads are not duplicated in an unindexed keyword copy.
    #
    # nginx-body-* shipping was REPLACED 2026-09-08 by the parsed
    # llm-request-body-* / llm-response-body-* indices (templates below);
    # this template + the ISM entry stay so existing nginx-body-* indices
    # keep aging out under the 14d policy.
    nginx_body_index_template:
      index_patterns:
        - nginx-body-*
      priority: 200
      template:
        settings:
          index.number_of_shards: 1
          index.number_of_replicas: 0
          index.plugins.index_state_management.policy_id: nginx-access-14d
        mappings:
          properties:
            status:
              type: long
              ignore_malformed: true
            request_body_bytes:
              type: long
              ignore_malformed: true
            response_body_bytes:
              type: long
              ignore_malformed: true
            request_id:
              type: keyword
            method:
              type: keyword
            # which llama-server instance (ip:port) served the request —
            # recorded by body-capture.lua, matches nginx-access upstream_addr
            upstream_addr:
              type: keyword
            host:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            uri:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            request_body:
              type: text
            response_body:
              type: text

    # Parsed LLM request/response body indices. The lua capture on the nginx
    # proxy (modules/nginx/files/body-capture.lua) parses every LLM API POST
    # into two structured documents -- the OpenAI-compatible request payload
    # and the response (SSE chunk stream or single completion JSON) -- and
    # Fluent Bit ships them into llm-request-body-YYYY.MM.dd /
    # llm-response-body-YYYY.MM.dd. 90-day retention: the bodies are the
    # analysis target, kept far longer than the 14-day access indices. The
    # identification fields (host, time_local, request, status, ...) mirror
    # the nginx-access-* json_analytics fields; join on request_id.
    llm_body_ism_policy:
      policy:
        description: LLM request/response body 90-day retention
        default_state: hot
        ism_template:
          index_patterns:
            - llm-request-body-*
            - llm-response-body-*
        states:
          - name: hot
            actions: []
            transitions:
              - state_name: delete
                conditions:
                  min_index_age: 90d
          - name: delete
            actions:
              - delete: {}
            transitions: []

    llm_request_body_index_template:
      index_patterns:
        - llm-request-body-*
      priority: 200
      template:
        settings:
          index.number_of_shards: 1
          index.number_of_replicas: 0
          index.plugins.index_state_management.policy_id: llm-body-90d
        mappings:
          # Nginx vars arrive as strings ("0.000", ""); numeric fields are
          # coerced here ("" dropped via ignore_malformed).
          properties:
            time_iso8601:
              type: date
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
              ignore_malformed: true
            time_local:
              type: keyword
            host:
              type: keyword
            request_id:
              type: keyword
            remote_addr:
              type: keyword
              fields:
                ip:
                  type: ip
            remote_user:
              type: keyword
            request:
              type: keyword
              ignore_above: 512
            status:
              type: long
              ignore_malformed: true
            body_bytes_sent:
              type: long
              ignore_malformed: true
            request_time:
              type: double
              ignore_malformed: true
            http_referrer:
              type: keyword
              ignore_above: 512
            http_user_agent:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 512
            http_x_forwarded_for:
              type: keyword
            upstream_addr:
              type: keyword
            upstream_response_time:
              type: double
              ignore_malformed: true
            upstream_status:
              type: long
              ignore_malformed: true
            method:
              type: keyword
            uri:
              type: keyword
            request_content_type:
              type: keyword
            response_content_type:
              type: keyword
            # Parsed request payload (OpenAI-compatible chat completion):
            model:
              type: keyword
            stream:
              type: boolean
            temperature:
              type: double
            top_p:
              type: double
            max_tokens:
              type: long
              ignore_malformed: true
            frequency_penalty:
              type: double
            presence_penalty:
              type: double
            messages_count:
              type: long
            tools_count:
              type: long
            system_prompt:
              type: text
            user_message:
              type: text
            # The decoded request payload embedded as an object (the lua
            # capture joins messages[].content part-arrays to a single string
            # before logging, so every field below has one type).
            request_body:
              type: object
              properties:
                model:
                  type: keyword
                stream:
                  type: boolean
                temperature:
                  type: double
                top_p:
                  type: double
                max_tokens:
                  type: long
                frequency_penalty:
                  type: double
                presence_penalty:
                  type: double
                # stored as their JSON string by the lua capture (the shape
                # varies per request; OpenSearch has no flattened type)
                stop:
                  type: text
                response_format:
                  type: text
                metadata:
                  type: text
                messages:
                  type: object
                  properties:
                    role:
                      type: keyword
                    name:
                      type: keyword
                    tool_call_id:
                      type: keyword
                    content:
                      type: text
                    reasoning_content:
                      type: text
                    tool_calls:
                      type: object
                      properties:
                        id:
                          type: keyword
                        type:
                          type: keyword
                        function:
                          type: object
                          properties:
                            name:
                              type: keyword
                            arguments:
                              type: text
                tools:
                  type: object
                  properties:
                    type:
                      type: keyword
                    function:
                      type: object
                      properties:
                        name:
                          type: keyword
                        description:
                          type: text
                        strict:
                          type: boolean
                        # JSON schema, stored as its JSON string by the lua
                        # capture (shape varies per tool; full-text searchable)
                        parameters:
                          type: text
            # non-JSON request payloads (parse_error) land here instead
            request_body_raw:
              type: text
            request_body_bytes:
              type: long
              ignore_malformed: true
            truncated:
              type: boolean

    llm_response_body_index_template:
      index_patterns:
        - llm-response-body-*
      priority: 200
      template:
        settings:
          index.number_of_shards: 1
          index.number_of_replicas: 0
          index.plugins.index_state_management.policy_id: llm-body-90d
        mappings:
          properties:
            time_iso8601:
              type: date
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
              ignore_malformed: true
            time_local:
              type: keyword
            host:
              type: keyword
            request_id:
              type: keyword
            remote_addr:
              type: keyword
              fields:
                ip:
                  type: ip
            remote_user:
              type: keyword
            request:
              type: keyword
              ignore_above: 512
            status:
              type: long
              ignore_malformed: true
            body_bytes_sent:
              type: long
              ignore_malformed: true
            request_time:
              type: double
              ignore_malformed: true
            http_referrer:
              type: keyword
              ignore_above: 512
            http_user_agent:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 512
            http_x_forwarded_for:
              type: keyword
            upstream_addr:
              type: keyword
            upstream_response_time:
              type: double
              ignore_malformed: true
            upstream_status:
              type: long
              ignore_malformed: true
            method:
              type: keyword
            uri:
              type: keyword
            request_content_type:
              type: keyword
            response_content_type:
              type: keyword
            # Parsed response (SSE stream or single completion JSON):
            stream:
              type: boolean
            completion_id:
              type: keyword
            model:
              type: keyword
            system_fingerprint:
              type: keyword
            created:
              type: long
              ignore_malformed: true
            finish_reason:
              type: keyword
            usage_prompt_tokens:
              type: long
              ignore_malformed: true
            usage_completion_tokens:
              type: long
              ignore_malformed: true
            usage_total_tokens:
              type: long
              ignore_malformed: true
            chunk_count:
              type: long
              ignore_malformed: true
            # Concatenated SSE deltas -- the final answer / thinking trace:
            content:
              type: text
            reasoning_content:
              type: text
            error_message:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 512
            # Decoded response payload (see body-capture.lua): the
            # completion JSON object for stream=false, or the SSE stream
            # reconstructed into a chat.completion object for stream=true
            # (content/reasoning/tool_calls deltas accumulated)
            response_body:
              type: object
              properties:
                object:
                  type: keyword
                id:
                  type: keyword
                created:
                  type: long
                  ignore_malformed: true
                model:
                  type: keyword
                system_fingerprint:
                  type: keyword
                choices:
                  type: object
                  properties:
                    index:
                      type: integer
                    finish_reason:
                      type: keyword
                    message:
                      type: object
                      properties:
                        role:
                          type: keyword
                        content:
                          type: text
                        reasoning_content:
                          type: text
                        tool_calls:
                          type: object
                          properties:
                            id:
                              type: keyword
                            type:
                              type: keyword
                            function:
                              type: object
                              properties:
                                name:
                                  type: keyword
                                arguments:
                                  type: text
                usage:
                  type: object
                  properties:
                    prompt_tokens:
                      type: long
                    completion_tokens:
                      type: long
                    total_tokens:
                      type: long
            # Non-parseable response bodies land here instead
            response_body_raw:
              type: text
            response_body_bytes:
              type: long
              ignore_malformed: true
            truncated:
              type: boolean

    # ----------------------------------------------------------------------------
    # Ingest pipeline for llama-server slot/timing lines.
    #
    # Verified against the real build (llama.cpp master, 2026): one event per
    # line, e.g.
    #   25.45.408.998 I slot print_timing: id  0 | task 8368 | prompt eval time =    5724.56 ms /  5048 tokens (    1.13 ms per token,   881.81 tokens per second)
    #   25.45.411.596 I slot      release: id  0 | task 8368 | stop processing: n_tokens = 87682, truncated = 0
    #
    # The leading D.SS.mmm.mmm clock is RELATIVE (process uptime), so Filebeat's
    # @timestamp (read time) is the correct event time — log_clock is only kept
    # as a string for in-log ordering.
    #
    # The pipeline body is verbatim from the ES 9 stack — grok / script
    # (painless) / convert are API-compatible, so nothing needed to change.
    # ----------------------------------------------------------------------------
    llama_pipeline:
      description: Parse llama-server slot/timing log lines into structured fields
      processors:
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s*n_gen =\s+(?<n_gen>\d+), tg =\s+(?<tg_tps>[\d.]+) t/s, tg_3s =\s+(?<tg3s_tps>[\d.]+) t/s'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s*prompt eval time =\s+(?<prompt_eval_ms>[\d.]+) ms / +(?<prompt_tokens>\d+) tokens \(\s+(?<prompt_ms_per_token>[\d.]+) ms per token,\s+(?<prompt_tps>[\d.]+) tokens per second\)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s+eval time =\s+(?<eval_ms>[\d.]+) ms / +(?<gen_tokens>\d+) tokens \(\s+(?<gen_ms_per_token>[\d.]+) ms per token,\s+(?<gen_tps>[\d.]+) tokens per second\)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s+total time =\s+(?<total_ms>[\d.]+) ms / +(?<total_tokens>\d+) tokens'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s+graphs reused = +(?<graphs_reused>\d+)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s+draft acceptance = +(?<draft_acceptance>[\d.]+) \(\s*(?<draft_accepted>\d+) accepted / +(?<draft_generated>\d+) generated\), mean len = +(?<draft_mean_len>[\d.]+)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+print_timing:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s+prompt processing, n_tokens = +(?<prompt_proc_tokens>\d+), progress = +(?<progress>[\d.]+), t = +(?<prompt_proc_s>[\d.]+) s / +(?<prompt_proc_tps>[\d.]+) tokens per second'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+release:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s*stop processing: n_tokens = +(?<n_tokens>\d+), truncated = +(?<truncated>\d+)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+launch_slot_:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)\s*\|\s*processing task, is_child = +(?<is_child>\d+)'
            ignore_failure: true
        - grok:
            field: message
            patterns:
              - '(?<log_clock>\d{2}\.\d{2}\.\d{3}\.\d{3})\sI\s+slot\s+get_availabl:\s+id\s+(?<slot_id>\d+)\s*\|\s*task\s+(?<task_id>-?\d+)'
            ignore_failure: true
        - script:
            source: |
              if (ctx.containsKey('n_gen')) {
                ctx.llama = ['event': 'slot_progress'];
              } else if (ctx.containsKey('prompt_eval_ms')) {
                ctx.llama = ['event': 'prompt_eval'];
              } else if (ctx.containsKey('eval_ms')) {
                ctx.llama = ['event': 'generation'];
              } else if (ctx.containsKey('total_ms')) {
                ctx.llama = ['event': 'total_time'];
              } else if (ctx.containsKey('graphs_reused')) {
                ctx.llama = ['event': 'graphs_reused'];
              } else if (ctx.containsKey('draft_acceptance')) {
                ctx.llama = ['event': 'draft_acceptance'];
              } else if (ctx.containsKey('prompt_proc_tokens')) {
                ctx.llama = ['event': 'prompt_progress'];
              } else if (ctx.containsKey('truncated')) {
                ctx.llama = ['event': 'slot_release'];
              } else if (ctx.containsKey('is_child')) {
                ctx.llama = ['event': 'slot_launch'];
              } else if (ctx.message != null && ctx.message.indexOf('get_availabl') != -1) {
                ctx.llama = ['event': 'slot_select'];
              }
        - convert:
            field: slot_id
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: task_id
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: n_gen
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_tokens
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: gen_tokens
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: total_tokens
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: graphs_reused
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: draft_accepted
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: draft_generated
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: n_tokens
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: truncated
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: is_child
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_proc_tokens
            type: integer
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: tg_tps
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: tg3s_tps
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_eval_ms
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_ms_per_token
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_tps
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: eval_ms
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: gen_ms_per_token
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: gen_tps
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: total_ms
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: draft_acceptance
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: draft_mean_len
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: progress
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_proc_s
            type: double
            ignore_failure: true
            ignore_missing: true
        - convert:
            field: prompt_proc_tps
            type: double
            ignore_failure: true
            ignore_missing: true

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 10

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: elk

    # --- Purge the old Elastic stack (ES 9 + Kibana 9) --------------------------
    # Guarded by dpkg: on a fresh VM neither package exists and every task
    # below is a no-op. On the in-place migration VM this stops and removes
    # the running stack so OpenSearch can take over :9200 / :5601.
    #
    # No data is carried over on purpose — see the play header.

    - name: Check for installed Elastic packages
      ansible.builtin.shell: dpkg-query -W elasticsearch kibana 2>/dev/null | grep -c . || true
      register: elastic_pkgs
      changed_when: false

    - name: Stop Elasticsearch and Kibana
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [elasticsearch, kibana]
      when: elastic_pkgs.stdout | int > 0

    - name: Purge Elasticsearch and Kibana packages
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get -y purge elasticsearch kibana
      when: elastic_pkgs.stdout | int > 0
      changed_when: true

    - name: Remove Elastic APT repository and GPG key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/elastic.yaml
        - /etc/apt/keyrings/elasticsearch.gpg

    - name: Remove Elasticsearch and Kibana data and config
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/elasticsearch
        - /var/log/elasticsearch
        - /etc/elasticsearch
        - /var/lib/kibana
        - /var/log/kibana
        - /etc/kibana
        - /usr/local/share/kibana-llm-content

    # --- OpenSearch APT repository (official 2.x bundle) -----------------------
    # The 2.x apt repos are still signed with the LEGACY 2021 release key;
    # the bucket's publickeys/ now only serves the 2025 key that signs the
    # 3.x repos. Fetch the legacy key by keyid from the keyserver and pin
    # it against the fingerprint published in the official docs. No
    # creates: guard: a stale or wrong key file must self-heal on the next
    # run — the fingerprint task below is the real gate.
    - name: Fetch OpenSearch 2.x release GPG key (legacy key from keyserver)
      ansible.builtin.shell: |
        set -o pipefail
        GNUPGHOME=$(mktemp -d)
        chmod 700 "$GNUPGHOME"
        gpg --homedir "$GNUPGHOME" --batch --keyserver hkps://keys.openpgp.org --recv-keys 39D319879310D3FC
        gpg --homedir "$GNUPGHOME" --batch --armor --export 39D319879310D3FC | gpg --batch --yes --dearmor -o /etc/apt/keyrings/opensearch.gpg
        rm -rf "$GNUPGHOME"
      changed_when: false

    - name: Verify OpenSearch release key fingerprint
      ansible.builtin.shell: gpg --no-default-keyring --keyring /etc/apt/keyrings/opensearch.gpg --fingerprint
      register: os_key_fp
      changed_when: false
      failed_when: "'C5B7498965EFD1C2924BA9D539D319879310D3FC' not in (os_key_fp.stdout | regex_replace('\\s+', ''))"

    - name: Add OpenSearch APT repository (2.x bundle)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/opensearch.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/opensearch.gpg] https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main
          deb [arch=amd64 signed-by=/etc/apt/keyrings/opensearch.gpg] https://artifacts.opensearch.org/releases/bundle/opensearch-dashboards/2.x/apt stable main

    # Hard-fail on update errors: the apt module can swallow a failed
    # `apt-get update` (transient network on first boot) and then the install
    # task fails confusingly with "No package matching ... is available".
    # A standalone update step makes the real error visible and the play
    # simply re-runs cleanly.
    - name: Update apt cache (hard failure on error)
      ansible.builtin.shell: apt-get update -qq
      changed_when: false
      register: apt_update
      failed_when: apt_update.rc != 0

    - name: Install OpenSearch and OpenSearch Dashboards (2.x)
      ansible.builtin.apt:
        update_cache: false
        name:
          - opensearch
          - opensearch-dashboards
        state: present
      # 2.12+ postinst runs the demo security config and FAILS without
      # OPENSEARCH_INITIAL_ADMIN_PASSWORD. We disable the security plugin
      # entirely, so skip the demo config — the env var reaches the
      # postinst through the apt-get/dpkg process chain.
      environment:
        DISABLE_INSTALL_DEMO_CONFIG: "true"
      register: opensearch_install

    # On UPGRADE the opensearch postinst restarts the service with whatever
    # stock config is present; on fresh install nothing is started. Stop
    # both defensively, configure, then start cleanly.
    - name: Stop services started by package postinsts
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [opensearch, opensearch-dashboards]
      when: opensearch_install is changed

    # OpenSearch Dashboards ships its own auth plugin (securityDashboards);
    # with OpenSearch-side security disabled it has no backend to validate
    # against and 401s EVERY request — the docs (disable-enable-security)
    # say to remove the plugin. Removal MUST delete the plugin dir as root:
    # `bin/opensearch-dashboards-plugin remove` as the service user prints
    # "complete" but cannot write the root-owned plugins dir (silent no-op).
    # Guarded on the dir: an apt upgrade of the opensearch-dashboards deb
    # re-adds the plugin, and this restores the no-security state on the
    # next deploy-elk run.
    - name: Check whether the securityDashboards plugin is installed
      ansible.builtin.stat:
        path: /usr/share/opensearch-dashboards/plugins/securityDashboards
      register: osds_sec

    - name: Remove the securityDashboards plugin
      ansible.builtin.shell: |
        systemctl stop opensearch-dashboards
        rm -rf /usr/share/opensearch-dashboards/plugins/securityDashboards
        python3 - <<'EOF'
        import json
        p = "/usr/share/opensearch-dashboards/package.json"
        d = json.load(open(p))
        d.get("opensearchDashboards", {}).get("plugins", [])[:] = [
            x for x in d.get("opensearchDashboards", {}).get("plugins", [])
            if x != "securityDashboards"
        ]
        json.dump(d, open(p, "w"), indent=2)
        EOF
      when: osds_sec.stat.exists
      register: osds_remove

    # --- OpenSearch ------------------------------------------------------------
    # The whole file is written (fresh install — no postinst collision to
    # fight, unlike the ES 9 deb which auto-configures security on first
    # start):
    #   - network.host pins HTTP to the LAN IP only (no loopback bind, same
    #     posture as the old ES config)
    #   - discovery.type: single-node — no master election, no cluster
    #   - plugins.security.disabled: true — set BEFORE first start so the
    #     security plugin's auto-config is skipped entirely
    # Heap: whatever the release defaults to (auto-sized on recent 2.x,
    # ~50% of RAM; fixed 1g on older ones) is fine for this volume — bump
    # via ES_JAVA_OPTS in /etc/default/opensearch if it ever needs it.
    - name: Write /etc/opensearch/opensearch.yml
      ansible.builtin.copy:
        dest: /etc/opensearch/opensearch.yml
        owner: opensearch
        group: opensearch
        mode: "0660"
        content: |
          cluster.name: elk-home
          node.name: elk-1
          network.host: "{{ es_ip }}"
          discovery.type: single-node
          plugins.security.disabled: true

    - name: Start and enable OpenSearch
      ansible.builtin.systemd:
        name: opensearch
        state: started
        enabled: true

    # OpenSearch binds to the LAN IP only (network.host is pinned — no
    # loopback), so wait on the LAN IP, not 127.0.0.1.
    - name: Wait for OpenSearch to answer
      ansible.builtin.wait_for:
        host: "{{ es_ip }}"
        port: 9200
        timeout: 300

    # Plugin/system indices (.tasks, ...) are created with replicas=1; on a
    # single-node cluster those replicas can never be assigned, so the
    # cluster sits at yellow forever and the green check below blocks.
    # Per-index updates are required — the `PUT /_all/_settings` action does
    # NOT cover system indices. Idempotent no-op once every index is at 0.
    - name: Zero replicas on all indices (single-node cluster)
      ansible.builtin.shell: |
        for idx in $(curl -s "http://{{ es_ip }}:9200/_cat/indices?expand_wildcards=all&format=json&h=index" | python3 -c "import json,sys; [print(i['index']) for i in json.load(sys.stdin)]"); do
          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$idx")
          curl -s -X PUT "http://{{ es_ip }}:9200/${enc}/_settings" -H "Content-Type: application/json" -d '{"index.number_of_replicas":0}' > /dev/null
        done
      changed_when: false

    # timeout must exceed the URL's own 60s wait — the uri module's default
    # (30s) otherwise expires mid-wait and every attempt "fails".
    - name: Wait for cluster health
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_cluster/health?wait_for_status=green&timeout=60s"
        status_code: 200
        timeout: 90
      register: os_health
      until: os_health.status == 200
      retries: 10
      delay: 10
      changed_when: false

    # --- Server-side ingest resources (policy adapted to OpenSearch ISM;
    #     templates and pipeline bodies verbatim from the ES 9 stack) ------
    # ISM policy PUTs are optimistic-concurrency: a plain PUT conflicts
    # (409) once the policy exists, and ?if_seq_no/if_primary_term fail on
    # first create — hence GET-then-PUT for idempotency.
    - name: Get current llm-logs ISM policy version
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/llm-logs-14d"
        method: GET
        status_code: [200, 404]
      register: llm_ism_get
      changed_when: false

    - name: Create or update ISM retention policy (llm-logs, delete after 14d)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/llm-logs-14d{% if llm_ism_get.status == 200 %}?if_seq_no={{ llm_ism_get.json._seq_no }}&if_primary_term={{ llm_ism_get.json._primary_term }}{% endif %}"
        method: PUT
        body_format: json
        body: "{{ llm_ism_policy | to_nice_json }}"
        status_code: [200, 201]

    - name: Deploy index template (llm-logs-*)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_index_template/llm-logs"
        method: PUT
        body_format: json
        body: "{{ index_template | to_nice_json }}"
        status_code: 200

    - name: Deploy llama log ingest pipeline
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_ingest/pipeline/llama-logs"
        method: PUT
        body_format: json
        body: "{{ llama_pipeline | to_nice_json }}"
        status_code: 200

    - name: Get current nginx-access ISM policy version
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/nginx-access-14d"
        method: GET
        status_code: [200, 404]
      register: nginx_ism_get
      changed_when: false

    - name: Create or update ISM retention policy (nginx-access, delete after 14d)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/nginx-access-14d{% if nginx_ism_get.status == 200 %}?if_seq_no={{ nginx_ism_get.json._seq_no }}&if_primary_term={{ nginx_ism_get.json._primary_term }}{% endif %}"
        method: PUT
        body_format: json
        body: "{{ nginx_ism_policy | to_nice_json }}"
        status_code: [200, 201]

    - name: Deploy nginx index template (nginx-access-*)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_index_template/nginx-access"
        method: PUT
        body_format: json
        body: "{{ nginx_index_template | to_nice_json }}"
        status_code: 200

    - name: Deploy nginx index template (nginx-body-*)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_index_template/nginx-body"
        method: PUT
        body_format: json
        body: "{{ nginx_body_index_template | to_nice_json }}"
        status_code: 200

    - name: Get current llm-body ISM policy version
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/llm-body-90d"
        method: GET
        status_code: [200, 404]
      register: llm_body_ism_get
      changed_when: false

    - name: Create or update ISM retention policy (llm-body, delete after 90d)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_plugins/_ism/policies/llm-body-90d{% if llm_body_ism_get.status == 200 %}?if_seq_no={{ llm_body_ism_get.json._seq_no }}&if_primary_term={{ llm_body_ism_get.json._primary_term }}{% endif %}"
        method: PUT
        body_format: json
        body: "{{ llm_body_ism_policy | to_nice_json }}"
        status_code: [200, 201]

    - name: Deploy index template (llm-request-body-*)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_index_template/llm-request-body"
        method: PUT
        body_format: json
        body: "{{ llm_request_body_index_template | to_nice_json }}"
        status_code: 200

    - name: Deploy index template (llm-response-body-*)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_index_template/llm-response-body"
        method: PUT
        body_format: json
        body: "{{ llm_response_body_index_template | to_nice_json }}"
        status_code: 200

    # _simulate response shape: docs[0].doc._source — same as ES 9.
    - name: Sanity-check pipeline against a real slot log line
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_ingest/pipeline/llama-logs/_simulate"
        method: POST
        body_format: json
        body: '{"docs":[{"_source":{"message":"25.45.408.998 I slot print_timing: id  0 | task 8368 | prompt eval time =    5724.56 ms /  5048 tokens (    1.13 ms per token,   881.81 tokens per second)"}}]}'
        status_code: 200
      register: pipeline_sim
      failed_when: >-
        pipeline_sim.status != 200
        or pipeline_sim.json.docs[0].doc._source.get('llama', {}).get('event') != 'prompt_eval'
        or pipeline_sim.json.docs[0].doc._source.get('prompt_tokens') != 5048
      changed_when: false

    # --- OpenSearch Dashboards --------------------------------------------------
    # Config is written whole (fresh install). No credentials needed —
    # server-side security is disabled.
    - name: Write /etc/opensearch-dashboards/opensearch_dashboards.yml
      ansible.builtin.copy:
        dest: /etc/opensearch-dashboards/opensearch_dashboards.yml
        owner: root
        group: opensearch-dashboards
        mode: "0644"
        content: |
          server.port: 5601
          server.host: "0.0.0.0"
          opensearch.hosts:
            - "http://{{ es_ip }}:9200"

    - name: Start and enable OpenSearch Dashboards
      ansible.builtin.systemd:
        name: opensearch-dashboards
        state: started
        enabled: true

    - name: Wait for OpenSearch Dashboards to answer
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5601
        timeout: 300

    - name: Wait for OpenSearch Dashboards status API
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:5601/api/status"
        status_code: 200
      register: ods_status
      until: ods_status.status == 200
      retries: 10
      delay: 10
      changed_when: false

    # ODS creates its own system indices on first start (after the first
    # zero-replica pass) — run the pass again so the cluster ends green.
    - name: Zero replicas on all indices (after Dashboards system indices)
      ansible.builtin.shell: |
        for idx in $(curl -s "http://{{ es_ip }}:9200/_cat/indices?expand_wildcards=all&format=json&h=index" | python3 -c "import json,sys; [print(i['index']) for i in json.load(sys.stdin)]"); do
          enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$idx")
          curl -s -X PUT "http://{{ es_ip }}:9200/${enc}/_settings" -H "Content-Type: application/json" -d '{"index.number_of_replicas":0}' > /dev/null
        done
      changed_when: false

    - name: Wait for cluster health (post Dashboards)
      ansible.builtin.uri:
        url: "http://{{ es_ip }}:9200/_cluster/health?wait_for_status=green&timeout=60s"
        status_code: 200
        timeout: 90
      register: os_health_final
      until: os_health_final.status == 200
      retries: 10
      delay: 10
      changed_when: false

    # --- Dashboard content ---------------------------------------------------------
    # Classic saved objects (data views, TSVB line/area charts, dashboards)
    # imported via the stable NDJSON import endpoint with overwrite=true —
    # re-running the play replaces the objects in place, so this is
    # idempotent. The .ndjson files are generated from dashboards/*.json by
    # generate_ods_objects.py (run locally, committed).
    - name: Create Dashboards content directory
      ansible.builtin.file:
        path: /usr/local/share/ods-llm-content
        state: directory
        mode: "0755"

    - name: Deploy Dashboards NDJSON definitions
      ansible.builtin.copy:
        src: "dashboards/{{ item }}"
        dest: "/usr/local/share/ods-llm-content/{{ item }}"
        mode: "0644"
      loop:
        - llm-dashboards.ndjson
        - nginx-dashboards.ndjson
        - request-flow-dashboards.ndjson

    - name: Import LLM Observability objects (data view, charts, dashboard)
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - -F
          - "file=@/usr/local/share/ods-llm-content/llm-dashboards.ndjson"
          - -H
          - "osd-xsrf: true"
          - "http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true"
      register: llm_import
      changed_when: true

    - name: Assert all LLM objects imported without failure
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import json, sys;
            r = json.loads(sys.argv[1]);
            failed = r.get("failuresCount", r.get("failed", len(r.get("failures", []))));
            ok = r.get("successCount", r.get("succeeded", 0));
            print("imported ok=%s failed=%s" % (ok, failed));
            sys.exit(1 if failed else 0)
          - "{{ llm_import.stdout }}"
      changed_when: false

    - name: Import NGINX Proxy Analytics objects (data view, charts, dashboard)
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - -F
          - "file=@/usr/local/share/ods-llm-content/nginx-dashboards.ndjson"
          - -H
          - "osd-xsrf: true"
          - "http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true"
      register: nginx_import
      changed_when: true

    - name: Assert all NGINX objects imported without failure
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import json, sys;
            r = json.loads(sys.argv[1]);
            failed = r.get("failuresCount", r.get("failed", len(r.get("failures", []))));
            ok = r.get("successCount", r.get("succeeded", 0));
            print("imported ok=%s failed=%s" % (ok, failed));
            sys.exit(1 if failed else 0)
          - "{{ nginx_import.stdout }}"
      changed_when: false

    - name: Import Request Flow (LLM) objects (data views, charts, dashboard)
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - -F
          - "file=@/usr/local/share/ods-llm-content/request-flow-dashboards.ndjson"
          - -H
          - "osd-xsrf: true"
          - "http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true"
      register: flow_import
      changed_when: true

    - name: Assert all Request Flow objects imported without failure
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import json, sys;
            r = json.loads(sys.argv[1]);
            failed = r.get("failuresCount", r.get("failed", len(r.get("failures", []))));
            ok = r.get("successCount", r.get("succeeded", 0));
            print("imported ok=%s failed=%s" % (ok, failed));
            sys.exit(1 if failed else 0)
          - "{{ flow_import.stdout }}"
      changed_when: false

    # End-to-end check that the import actually landed all dashboards.
    - name: Verify all dashboards exist
      ansible.builtin.uri:
        url: "http://127.0.0.1:5601/api/saved_objects/_find?per_page=100&type=dashboard"
        status_code: 200
      register: dashboards_found
      changed_when: false

    - name: Assert LLM, NGINX and Request Flow dashboards are present
      ansible.builtin.assert:
        that:
          - (dashboards_found.json.saved_objects | map(attribute="id") | select("in", ["llm-observability", "nginx-proxy-analytics", "request-flow-llm"]) | list | length) == 3
        fail_msg: Dashboards missing after import — re-run the play; check /var/log/opensearch-dashboards/ for import errors.
