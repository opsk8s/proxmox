---
- name: Install and configure Open WebUI (pip package)
  hosts: open-webui
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    webui_user: openwebui
    webui_app_dir: /home/openwebui/open-webui
    webui_venv: /home/openwebui/open-webui/.venv
    uv_bin: /home/openwebui/.local/bin/uv
    webui_port: 8080
    # webui_ip / llm_ip: terraform passes them via extra_vars (proxmox.tfvars)
    # OpenAI-compatible endpoint: llama-server on GPU0 of the LLM VM. The 4
    # llama.cpp servers run directly on 8001-8004 (one per GPU, same model,
    # see modules/llm/ansible.yml); load balancing is left to the caller.
    # https: the gateway serves .lan names over TLS (modules/nginx LAN CA)
    # and the browser blocks the http endpoint from an https page.
    llm_api_base_url: "https://app.llm.lan/v1"
    # RAG wiring: documents are embedded by the dedicated llama.cpp embedding
    # server on the LLM VM (embed.llm.lan -> :8005, --embedding mode) and the
    # vectors are stored in the qdrant VM. RAG_EMBEDDING_MODEL must match the
    # alias the embedding server was loaded with (embed_alias in modules/llm).
    # PREFER_GRPC is false: the gateway does not proxy qdrant's gRPC port.
    #
    embed_api_base_url: "https://embed.llm.lan/v1"
    embed_model_name: "Qwen3-Embedding-0.6B"
    qdrant_url: "https://app.qdrant.lan"
    # qdrant_api_key: terraform / Makefile pass it via extra_vars (proxmox.tfvars)
    qdrant_api_key: ""

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 150
        delay: 5
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: open-webui

    # Without the key Qdrant answers 401 on every RAG call and Open WebUI
    # silently falls back to keyword-only retrieval — fail early and legibly.
    - name: Fail early when qdrant_api_key is not provided
      ansible.builtin.fail:
        msg: >-
          Pass qdrant_api_key via the ansible_playbook_run extra_vars in
          Terraform (qdrant_api_key in proxmox.tfvars)
      when: qdrant_api_key | length == 0

    - name: Install prerequisites
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          # Open WebUI's audio router (pydub) shells out to ffmpeg/ffprobe;
          # without them it logs "No such file or directory: 'ffprobe'" on
          # every transcription and can't inspect/convert uploaded audio.
          - ffmpeg
        state: present

    # Open WebUI's working set (app + langchain + the bundled
    # sentence-transformers embedding model) outgrew the VM's RAM and the
    # kernel OOM-killed the service repeatedly. A swapfile is the safety net:
    # a spike degrades instead of hard-killing the process.
    - name: Check whether the swapfile already exists
      ansible.builtin.stat:
        path: /swapfile
      register: webui_swapfile

    - name: Create a 4 GiB swapfile
      ansible.builtin.command:
        cmd: fallocate -l 4G /swapfile
        creates: /swapfile

    - name: Restrict swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Format the swapfile (first run only)
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: not webui_swapfile.stat.exists
      changed_when: true

    - name: Persist the swapfile in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: List currently active swap devices
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: webui_swapon
      changed_when: false
      failed_when: false

    - name: Enable the swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: "'/swapfile' not in (webui_swapon.stdout | default(''))"
      changed_when: true

    # The LLM endpoint is served over TLS by the nginx gateway with a leaf
    # signed by the private "LAN Home CA" (modules/nginx). Fetch the CA root
    # from the gateway over plain http (the TLS leaf cannot be trusted yet),
    # presenting the shared token the gateway requires (x-lan-ca-token
    # header, lan_ca_token from proxmox.tfvars), then install the root in
    # the system trust store so the https:// calls below verify.
    - name: Fetch the LAN CA root from the nginx gateway
      ansible.builtin.uri:
        url: "http://{{ nginx_ip }}/lan-ca.pem"
        headers:
          x-lan-ca-token: "{{ lan_ca_token }}"
        return_content: true
        status_code: 200
        timeout: 10
      register: lan_ca
      until: lan_ca.status == 200
      retries: 60
      delay: 10
      changed_when: false

    - name: Install the LAN CA root in the system trust store
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/lan-ca.crt
        owner: root
        group: root
        mode: "0644"
        content: "{{ lan_ca.content }}"
      register: lan_ca_install

    - name: Update the system trust store
      ansible.builtin.command: update-ca-certificates
      when: lan_ca_install is changed
      changed_when: true

#    - name: Verify the LLM endpoint is reachable over https
#      ansible.builtin.uri:
#        url: "{{ llm_api_base_url }}/models"
#        # 502/503 mean nginx reached a still-booting llama-server — the TLS
#        # handshake and certificate verification already succeeded, which is
#        # what this check exists for; 200 is expected once the models load
#        status_code: [200, 404, 502, 503]
#        timeout: 10
#      register: llm_https
#      until: llm_https.status in [200, 404, 502, 503]
#      retries: 60
#      delay: 10
#      changed_when: false

    # uv is only used to provision a CPython 3.11: the open-webui wheel
    # requires Python >=3.11,<3.13, but Ubuntu 26.04 ships 3.14.
    - name: Install uv (manages the CPython 3.11 for the venv)
      ansible.builtin.shell: >
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: /home/openwebui/.local/bin/uv
      become: true
      become_user: openwebui

    - name: Create virtualenv with CPython 3.11
      ansible.builtin.command:
        cmd: "{{ uv_bin }} venv --python 3.11 {{ webui_venv }}"
      args:
        creates: "{{ webui_venv }}"
      become: true
      become_user: openwebui

    # rc != 0 on a fresh venv (nothing installed yet) and a print of the
    # version on re-deploys — that is what splits install from upgrade.
    - name: Check installed open-webui version
      ansible.builtin.command:
        cmd: >-
          {{ webui_venv }}/bin/python -c 'import importlib.metadata as m;
          print(m.version("open-webui"))'
      register: webui_installed
      failed_when: false
      changed_when: false
      become: true
      become_user: openwebui

    - name: Install open-webui
      ansible.builtin.command:
        cmd: "{{ uv_bin }} pip install --python {{ webui_venv }}/bin/python open-webui"
      become: true
      become_user: openwebui
      when: webui_installed is failed

    # Re-deploy on an existing VM (make deploy-open-webui / after_update):
    # uv prints "Audited N packages" when nothing new is available, so the
    # task stays idempotent and only reports changed on a real upgrade.
    - name: Upgrade open-webui
      ansible.builtin.command:
        cmd: "{{ uv_bin }} pip install --upgrade --python {{ webui_venv }}/bin/python open-webui"
      become: true
      become_user: openwebui
      when: webui_installed is succeeded
      register: webui_upgrade
      changed_when: "'Audited' not in webui_upgrade.stdout"

    # The open-webui wheel ships chromadb but NOT qdrant-client, so
    # VECTOR_DB=qdrant cannot start without it. Separate from the tasks above
    # because those only refresh the open-webui package tree.
    #
    # Guarded by an installed-version check (like open-webui itself above)
    # rather than by parsing uv's output: uv writes its status line —
    # "Checked N packages", or "Audited" on older versions — to STDERR, so a
    # stdout-based changed_when cannot see it and the task would report
    # changed on every run.
    - name: Check whether the Qdrant client is installed in the venv
      ansible.builtin.command:
        cmd: >-
          {{ webui_venv }}/bin/python -c 'import importlib.metadata as m;
          print(m.version("qdrant-client"))'
      register: webui_qdrant_installed
      failed_when: false
      changed_when: false
      become: true
      become_user: openwebui

    - name: Install the Qdrant client into the venv
      ansible.builtin.command:
        cmd: "{{ uv_bin }} pip install --python {{ webui_venv }}/bin/python qdrant-client"
      become: true
      become_user: openwebui
      when: webui_qdrant_installed.rc != 0

    - name: Ensure data directory exists (sqlite db, uploads, vector db)
      ansible.builtin.file:
        path: "{{ webui_app_dir }}/data"
        state: directory
        owner: openwebui
        group: openwebui
        mode: "0755"

    # Mode 0640: the unit carries the Qdrant API key in an Environment= line
    # (same choice as qdrant.service), so it must not be world-readable.
    - name: Deploy open-webui.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/open-webui.service
        owner: root
        group: root
        mode: "0640"
        content: |
          [Unit]
          Description=Open WebUI
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=openwebui
          Group=openwebui
          WorkingDirectory={{ webui_app_dir }}
          Environment=HOME=/home/openwebui
          Environment=PATH=/home/openwebui/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # keep data out of the venv so upgrades/reinstalls never wipe it
          Environment=DATA_DIR={{ webui_app_dir }}/data
          # OpenAI-compatible endpoint (llama-server on the LLM VM, port 8001)
          Environment=OPENAI_API_BASE_URL={{ llm_api_base_url }}
          Environment=OPENAI_API_KEY=local
          # RAG: vectors in qdrant, embeddings from the dedicated llama.cpp
          # embedding server. These env vars are only defaults for Open
          # WebUI's PersistentConfig — a value edited in Admin Settings is
          # stored in webui.db and would win over the env var.
          Environment=VECTOR_DB=qdrant
          Environment=QDRANT_URI={{ qdrant_url }}
          Environment=QDRANT_API_KEY={{ qdrant_api_key }}
          # the gateway proxies qdrant's REST port only (no grpc_pass)
          Environment=QDRANT_PREFER_GRPC=false
          Environment=RAG_EMBEDDING_ENGINE=openai
          Environment=RAG_EMBEDDING_MODEL={{ embed_model_name }}
          Environment=RAG_OPENAI_API_BASE_URL={{ embed_api_base_url }}
          Environment=RAG_OPENAI_API_KEY=local
          # TLS trust for the https:// .lan endpoints above: the venv's httpx
          # (openai SDK + qdrant client) honours SSL_CERT_FILE, requests
          # honours REQUESTS_CA_BUNDLE — both otherwise use certifi, which
          # does not carry the LAN CA installed earlier in this play.
          Environment=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          Environment=REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          # Voice mode: STT + TTS live on the LLM VM as OpenAI-compatible
          # audio endpoints (whisper-server :8085, Kokoro :8086).
          Environment=AUDIO_STT_ENGINE=openai
          Environment=AUDIO_STT_MODEL=large-v3-turbo
          Environment=AUDIO_STT_OPENAI_API_BASE_URL=https://stt.llm.lan/v1
          Environment=AUDIO_STT_OPENAI_API_KEY=local
          Environment=AUDIO_TTS_ENGINE=openai
          Environment=AUDIO_TTS_MODEL=kokoro
          Environment=AUDIO_TTS_VOICE=af_heart
          Environment=AUDIO_TTS_OPENAI_API_BASE_URL=https://tts.llm.lan/v1
          Environment=AUDIO_TTS_OPENAI_API_KEY=local
          Environment=SCARF_NO_ANALYTICS=true
          Environment=DO_NOT_TRACK=true
          ExecStart={{ webui_venv }}/bin/open-webui serve --host 0.0.0.0 --port {{ webui_port }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: restart open-webui

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start Open WebUI
      ansible.builtin.systemd:
        name: open-webui
        state: started
        enabled: true

    # state: started above is a no-op while the old version keeps running,
    # so an actual upgrade needs an explicit restart to pick it up.
    - name: Restart Open WebUI after upgrade
      ansible.builtin.systemd:
        name: open-webui
        state: restarted
      when: webui_upgrade is changed

    - name: Wait for Open WebUI to answer on the LAN
      ansible.builtin.uri:
        url: "http://{{ webui_ip }}:{{ webui_port }}/"
        status_code: 200
        timeout: 10
      register: webui_check
      until: webui_check.status == 200
      retries: 30
      delay: 10
      changed_when: false

    # End-to-end proof of the RAG path using the deployed unit's own config
    # (parsed from open-webui.service, so a wrong env var fails here) and the
    # venv's own libraries: embed a probe sentence through the gateway
    # (embed.llm.lan -> llama.cpp --embedding) and round-trip the vector
    # through a throwaway qdrant collection, which is removed again. Runs as
    # root because the unit is 0640 (it carries the API key); the LAN CA is
    # loaded explicitly because this shell is not the service process.
    - name: Verify the llama.cpp -> Qdrant RAG path end to end
      ansible.builtin.shell: |
        set -euo pipefail
        {{ webui_venv }}/bin/python - <<'PY'
        import os
        from openai import OpenAI
        from qdrant_client import QdrantClient
        from qdrant_client.models import Distance, PointStruct, VectorParams

        env = {}
        for line in open("/etc/systemd/system/open-webui.service"):
            line = line.strip()
            if line.startswith("Environment="):
                k, _, v = line[len("Environment="):].partition("=")
                env[k] = v

        assert env.get("VECTOR_DB") == "qdrant", env.get("VECTOR_DB")
        assert env.get("RAG_EMBEDDING_ENGINE") == "openai", env.get("RAG_EMBEDDING_ENGINE")
        assert env.get("QDRANT_API_KEY"), "QDRANT_API_KEY missing from the unit"

        ca = "/etc/ssl/certs/ca-certificates.crt"
        os.environ["SSL_CERT_FILE"] = ca
        os.environ["REQUESTS_CA_BUNDLE"] = ca

        vec = OpenAI(base_url=env["RAG_OPENAI_API_BASE_URL"],
                     api_key=env["RAG_OPENAI_API_KEY"]) \
            .embeddings.create(model=env["RAG_EMBEDDING_MODEL"],
                               input="proxmox rag probe").data[0].embedding
        assert len(vec) > 100, f"unexpected embedding size {len(vec)}"

        qd = QdrantClient(url=env["QDRANT_URI"], api_key=env["QDRANT_API_KEY"],
                          prefer_grpc=False)
        name = "open-webui-rag-probe"
        if qd.collection_exists(name):
            qd.delete_collection(name)
        qd.create_collection(name, vectors_config=VectorParams(size=len(vec),
                                                               distance=Distance.COSINE))
        qd.upsert(name, points=[PointStruct(id=1, vector=vec, payload={"probe": True})])
        hits = qd.query_points(name, query=vec, limit=1).points
        assert hits and hits[0].id == 1, "qdrant did not return the probe point"
        qd.delete_collection(name)
        print(f"ok: {len(vec)}-dim embedding stored and retrieved through qdrant")
        PY
      args:
        executable: /bin/bash
      become: true
      changed_when: false

  handlers:
    - name: restart open-webui
      ansible.builtin.systemd:
        name: open-webui
        state: restarted
        daemon_reload: true
