---
- name: Install and configure PostgreSQL
  hosts: postgres
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # terraform passes the values via ansible_playbook_run extra_vars
    # (make deploy-postgres does the same — see the Makefile)
    postgres_password: ""
    smartshift_admin_password: ""
    analytics_ro_password: ""
    # lan_network: terraform passes it via extra_vars (proxmox.tfvars)
    lan_subnet: "{{ lan_network }}"
    pg_port: 5432

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 150
        delay: 5
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Fail early when postgres_password is not provided
      ansible.builtin.fail:
        msg: "Pass postgres_password via the ansible_playbook_run extra_vars in Terraform"
      when: postgres_password | length == 0

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: postgres

    - name: Install PostgreSQL
      ansible.builtin.apt:
        update_cache: true
        name:
          - postgresql
          - postgresql-contrib
          # Python driver for the community.postgresql db provisioning tasks
          - python3-psycopg2
        state: present

    - name: Detect installed PostgreSQL major version
      ansible.builtin.shell: ls /etc/postgresql
      register: pg_version
      changed_when: false

    - name: Listen on all interfaces (LAN access)
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"

    # Ubuntu 26.04 / systemd 258 per-user /dev/shm quota reaps files owned by
    # the login uid when the session ends; the postgres server runs as that
    # same uid, so posix DSM segments get deleted from under the postmaster
    # and every new backend fails with "could not open shared memory segment".
    # sysv IPC segments are not files in /dev/shm, so they are unaffected.
    - name: Use sysv dynamic shared memory
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf
        regexp: '^#?dynamic_shared_memory_type'
        line: "dynamic_shared_memory_type = sysv"

    - name: Allow LAN clients (scram-sha-256)
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version.stdout }}/main/pg_hba.conf
        line: "host    all             all             {{ lan_subnet }}    scram-sha-256"
        insertafter: EOF

    # password embedded as a SQL literal with single quotes doubled;
    # argv list means no shell, so other special characters are safe
    - name: Set superuser password
      ansible.builtin.command:
        argv:
          - psql
          - -v
          - "ON_ERROR_STOP=1"
          - -qc
          - "ALTER USER postgres WITH PASSWORD '{{ postgres_password | replace(\"'\", \"''\") }}';"
      become_user: postgres
      changed_when: true

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Wait for PostgreSQL to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ pg_port }}"
        timeout: 120

    # --- Databases (declarative, from database.yaml) --------------------------
    # The template lookup renders {{ *_password }} in database.yaml from the
    # extra_vars Terraform passes (values live in proxmox.tfvars).
    - name: Load database definitions
      ansible.builtin.set_fact:
        db_definitions: "{{ (lookup('ansible.builtin.template', 'database.yaml') | from_yaml).databases }}"

    - name: Fail early when a database password is not provided
      ansible.builtin.fail:
        msg: "Set the password for {{ item.user }} in proxmox.tfvars (see extra_vars in modules/postgres/main.tf)"
      when: item.password | length == 0
      loop: "{{ db_definitions }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure databases exist
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        encoding: UTF8
        state: present
      become_user: postgres
      loop: "{{ db_definitions }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure database users exist
      community.postgresql.postgresql_user:
        name: "{{ item.user }}"
        password: "{{ item.password }}"
        state: present
      become_user: postgres
      loop: "{{ db_definitions }}"
      loop_control:
        label: "{{ item.user }}"

    - name: Grant database permissions
      community.postgresql.postgresql_privs:
        login_db: "{{ item.name }}"
        roles: "{{ item.user }}"
        type: database
        privs: "{{ item.permissions | join(',') }}"
        state: present
      become_user: postgres
      loop: "{{ db_definitions }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure database schemas exist (owner defaults to the database user)
      community.postgresql.postgresql_schema:
        login_db: "{{ item.0.name }}"
        name: "{{ item.1.name }}"
        owner: "{{ item.1.owner | default(item.0.user, true) }}"
        state: present
      become_user: postgres
      loop: "{{ db_definitions | subelements('schemas', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }}.{{ item.1.name }}"
