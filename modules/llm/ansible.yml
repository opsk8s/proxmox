---
- name: Configure LLM VM
  hosts: llm
  become: true
  gather_facts: false
  vars:
    # Kokoro TTS runs on ROCm torch. Kokoro-FastAPI has no GPU-index setting
    # (device is just "cuda" or "cpu"), so the card is chosen by restricting
    # what the process can see. ROCm device order != Vulkan device order
    # (llama-server/whisper use Vulkan 0-3) — verify with `rocm-smi --showbus`.
    # Card 0 also hosts whisper.cpp, so 1-3 have the most headroom.
    kokoro_gpu: "3"
    # Dedicated embedding server for RAG (Open WebUI -> Qdrant). It is a
    # separate instance because --embedding RESTRICTS a llama-server to the
    # embedding use case, so it cannot be folded into the 8001-8004 chat
    # shards. --pooling is deliberately left unset: the GGUF carries
    # qwen3.pooling_type = 3 (LAST, the pooling Qwen3-Embedding expects) and
    # llama.cpp uses the model default when the flag is absent. Output is
    # 1024-dim (qwen3.embedding_length). Vulkan device 2: the four chat
    # shards hold ~22 GB of the 32 GB on cards 0-3 and card 3 additionally
    # hosts whisper + Kokoro (~25 GB used), so 0-2 have the headroom.
    embed_gpu: "3"
    embed_port: 8005
    embed_alias: Qwen3-Embedding-0.6B
    embed_model: /mnt/models/Qwen3-Embedding-0.6B-Q8_0.gguf
    embed_model_url: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf"

    # German Kokoro TTS (kikiri-tts per-speaker fine-tunes). Base Kokoro has no
    # German (no lang_code 'd'), so these run a SECOND Kokoro-FastAPI checkout
    # whose venv has the German `kokoro` fork (adds lang_code 'd') and the
    # `misaki[de]` fork (German G2P) installed over the stock packages. ONE
    # checkout/venv serves both speakers; each unit picks its model + voice via
    # env. English is untouched on the base-model instance (kokoro.service, 8086).
    kokoro_de_dir: /home/llm/kokoro-fastapi-de
    kokoro_de_fork: "git+https://github.com/semidark/kokoro.git@main"
    kokoro_de_misaki: "git+https://github.com/semidark/misaki.git@main"
    kokoro_de_instances:
      - { name: martin,   port: 8087, model_repo: kikiri-tts/kikiri-german-martin,   model_file: kikiri_german_martin_ep10.pth,   voice: dm_martin,   voice_src: voices/martin.pt }
      - { name: victoria, port: 8088, model_repo: kikiri-tts/kikiri-german-victoria, model_file: kikiri_german_victoria_ep10.pth, voice: dv_victoria, voice_src: voices/victoria.pt }
    # One stock whisper-server per language: the multilingual model is shared
    # (there is no separate German model), only port and the pinned -l differ.
    # Pinning beats -l auto: large-v3-turbo's language auto-detect misfires
    # German clips to English, and Open WebUI never sends a per-request
    # language field — so the endpoint IS the language switch (stt vs
    # stt-de, see the nginx module), same pattern as the German Kokoro TTS.
    whisper_instances:
      - { name: "",    port: 8085, lang: en }
      - { name: "-de", port: 8089, lang: de }
  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 150
        delay: 5
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    # 1. Create the directory (replaces 'mkdir --parents')
    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # 2. Fetch and dearmor BOTH keys (replaces 'wget | gpg | tee')
    - name: Fetch and dearmor AMD GPG keys
      ansible.builtin.shell: |
        wget -qO- {{ item.url }} | gpg --dearmor -o {{ item.key }}
      args:
        creates: "{{ item.key }}"
      loop:
        - url: https://repo.radeon.com/rocm/rocm.gpg.key
          key: /etc/apt/keyrings/rocm.gpg
        - url: https://stable.repo.amd.com/rocm/gpg/packages.gpg
          key: /etc/apt/keyrings/amdrocm.gpg

    # 3. Add BOTH repositories (replaces 'tee ... .list' / 'tee ... .sources')
    - name: Add AMD repositories (deb822 format)
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: deb
        uris: "{{ item.uri }}"
        suites: "{{ item.suite }}"
        components: main
        architectures: amd64
        signed_by: "{{ item.key }}"
        enabled: true
      loop:
        - name: amdgpu
          uri: https://repo.radeon.com/amdgpu/31.50/ubuntu
          suite: resolute
          key: /etc/apt/keyrings/rocm.gpg
        - name: rocm
          uri: https://stable.repo.amd.com/rocm/core/packages/ubuntu2604/
          suite: stable
          key: /etc/apt/keyrings/amdrocm.gpg

    # 4. Update APT (replaces 'apt update')
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all system packages to the latest version
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
      register: apt_upgrade_result

    - name: Check if a reboot is required (e.g., kernel upgrade)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the system if a kernel or critical update was installed
      ansible.builtin.reboot:
        msg: "Rebooting to apply kernel/driver updates..."
        reboot_timeout: 600  # Give it 10 minutes to shut down and boot back up (DKMS can slow down boot)
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: Enable Universe repository
      ansible.builtin.command:
        cmd: add-apt-repository -y universe

    - name: Install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - curl
          - net-tools
          - nvtop
          - btop
          - libatomic1
          - libquadmath0
          - amdgpu-dkms
          - amdrocm10.0-gfx1201
          - amdrocm-core-dev10.0-gfx1201
          - amdrocm-core-sdk10.0-gfx1201
          - amdrocm-developer-tools10.0
          - amdrocm-opencl10.0
          - build-essential
          - ccache
          - cmake
          - git
          - pkg-config
          - libvulkan-dev
          - mesa-vulkan-drivers
          - vulkan-tools
          - glslang-tools
          - libssl-dev
          - glslc
          - spirv-headers
          - ninja-build
      register: apt_result

    - name: Ensure GPU groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: [ render, video ]

    - name: Add llm to GPU groups
      ansible.builtin.user:
        name: llm
        groups: render,video
        append: true

    - name: Deploy udev rules
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/70-amdgpu.rules
        mode: "0644"
        content: |
          KERNEL=="kfd", GROUP="render", MODE="0666"
          SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0666"
      notify: reload udev

    - name: Grant llm user read-write access to the mount point
      ansible.builtin.file:
        path: /mnt/models
        owner: llm
        group: llm
        mode: "0775"

    - name: Push my scripts (this is your "upload" mechanism)
      ansible.builtin.copy:
        src: llm-scripts/
        dest: /home/llm/scripts/
        owner: llm
        group: llm
        mode: "0755"

    - name: Reboot only when drivers changed, and wait for it to come back
      ansible.builtin.reboot:
      when: apt_result.changed

    - name: Set ROCm environment variables system-wide
      ansible.builtin.copy:
        dest: /etc/profile.d/rocm-env.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # rocm related
          export ROCM_PATH=/opt/rocm
          export HIP_PATH=$ROCM_PATH
          export HIP_CLANG_PATH="$ROCM_PATH/llvm/bin"
          export HIP_PLATFORM=amd
          export PATH="$ROCM_PATH/bin:$ROCM_PATH/llvm/bin:$PATH"
          export LD_LIBRARY_PATH="$ROCM_PATH/core-10.0/lib:$LD_LIBRARY_PATH"
          export PYTORCH_ROCM_ARCH="gfx1201"
          export HIP_ARCHITECTURES="gfx1201"
          export GPU_TARGETS="gfx1201"
          # build and vllm related
          export MAX_JOBS=$(nproc)
          export CMAKE_BUILD_PARALLEL_LEVEL=$MAX_JOBS
          export TORCHINDUCTOR_COMPILE_THREADS=$MAX_JOBS
          export OMP_NUM_THREADS=$MAX_JOBS
          export MKL_NUM_THREADS=$MAX_JOBS
          export NUMEXPR_NUM_THREADS=$MAX_JOBS
          export OPENBLAS_NUM_THREADS=$MAX_JOBS
      

    - name: Install nvm (Node Version Manager)
      ansible.builtin.shell: >
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | PROFILE=/dev/null bash
      args:
        creates: /home/llm/.nvm/nvm.sh
      become: true
      become_user: llm

    - name: Add nvm sourcing to llm user's bashrc
      ansible.builtin.blockinfile:
        path: /home/llm/.bashrc
        owner: llm
        group: llm
        marker: "# {mark} ANSIBLE MANAGED BLOCK: NVM"
        block: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

    - name: Install Node.js LTS and set as default
      ansible.builtin.shell: |
        source /home/llm/.nvm/nvm.sh
        nvm install --lts
        nvm alias default 'lts/*'
      args:
        executable: /bin/bash
      become: true
      become_user: llm
      register: nvm_result
      changed_when: "'already installed' not in nvm_result.stdout"

    - name: Install uv (Python package manager)
      ansible.builtin.shell: >
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: /home/llm/.local/bin/uv
      become: true
      become_user: llm

    - name: Ensure ~/.local/bin is in llm user's PATH
      ansible.builtin.lineinfile:
        path: /home/llm/.bashrc
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        create: true
        owner: llm
        group: llm
        mode: "0644"

    - name: Clone llama.cpp repository into llm user's home directory
      ansible.builtin.git:
        repo: 'https://github.com/ggerganov/llama.cpp.git'
        dest: /home/llm/llama.cpp
        version: master  # You can change this to a specific tag like 'b3995' for reproducible builds
      become: true
      become_user: llm

    - name: Build llama.cpp using the ROCm build script
      ansible.builtin.shell: |
        # Explicitly load the ROCm environment variables we added earlier
        source /home/llm/.bashrc

        # Execute the build script
        /home/llm/scripts/build-llama-rocm.sh
      args:
        executable: /bin/bash
        # Idempotency: Skip this task if the final compiled binary already exists.
        # (Adjust this path if your script outputs the binary somewhere else)
        creates: /home/llm/llama.cpp/build-rocm/bin/llama-cli
      become: true
      become_user: llm

    - name: Build llama.cpp using the Vulkan build script
      ansible.builtin.shell: |
        # Explicitly load the ROCm environment variables we added earlier
        source /home/llm/.bashrc

        # Execute the build script
        /home/llm/scripts/build-llama-vulkan.sh
      args:
        executable: /bin/bash
        # Idempotency: Skip this task if the final compiled binary already exists.
        # (Adjust this path if your script outputs the binary somewhere else)
        creates: /home/llm/llama.cpp/build-vulkan/bin/llama-cli
      become: true
      become_user: llm

