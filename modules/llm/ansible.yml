    - name: Read HF_TOKEN from VM's environment file
      ansible.builtin.shell: grep HF_TOKEN /etc/environment | cut -d'=' -f2 | tr -d '"'
      register: hf_token_result
      changed_when: false
#
    - name: Download Qwen2.5-Coder 14B Q6 model via wget
      ansible.builtin.shell: |
        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen2.5-Coder-14B-Instruct-128K-GGUF/resolve/main/Qwen2.5-Coder-14B-Instruct-Q6_K.gguf"
        OUTPUT_FILE="/mnt/models/Qwen2.5-Coder-14B-Instruct-Q6_K_XL.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
             -O "${OUTPUT_FILE}" \
             "${MODEL_URL}"
      args:
        executable: /bin/bash
        # Idempotency: Only run if the file does NOT exist
        creates: /mnt/models/Qwen2.5-Coder-14B-Instruct-Q6_K_XL.gguf
      become: true
      become_user: llm
#
    - name: Download Qwen3.8 Q4 model via wget
      ansible.builtin.shell: |
        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf"
        OUTPUT_FILE="/mnt/models/Qwen3.8-27B-UD-Q4_K_XL.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
