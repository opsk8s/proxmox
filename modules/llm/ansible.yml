      ansible.builtin.shell: |
        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen2.5-Coder-14B-Instruct-128K-GGUF/resolve/main/Qwen2.5-Coder-14B-Instruct-Q6_K.gguf"
        OUTPUT_FILE="/mnt/models/Qwen2.5-Coder-14B-Instruct-Q6_K_XL.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
             -O "${OUTPUT_FILE}" \
             "${MODEL_URL}"
      args:
        executable: /bin/bash
        # Idempotency: Only run if the file does NOT exist
        creates: /mnt/models/Qwen2.5-Coder-14B-Instruct-Q6_K_XL.gguf
      become: true
      become_user: llm
