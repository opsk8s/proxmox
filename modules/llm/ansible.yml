    - name: Download Qwen3.8 Vision model via wget
      ansible.builtin.shell: |
        # Ensure target directory exists
        mkdir -p /mnt/models

        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-BF16.gguf"
        OUTPUT_FILE="/mnt/models/Qwen3.8-27B-UD-mmproj-BF16.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
             -O "${OUTPUT_FILE}" \
             "${MODEL_URL}"
      args:
        executable: /bin/bash
        # Idempotency: Only run if the file does NOT exist
        creates: /mnt/models/Qwen3.8-27B-UD-mmproj-BF16.gguf
      become: true
      become_user: llm

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Deploy LLM load balancer config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/llm
        mode: "0644"
        content: |
          upstream llama_servers {
              least_conn;
              server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
              server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
              server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
              server 127.0.0.1:8004 max_fails=3 fail_timeout=30s;
              keepalive 16;
          }

          server {
              listen 8000 default_server;
              listen [::]:8000 default_server;
              server_name _;

              # LLM inference is long-running (seconds to minutes)
              proxy_connect_timeout 60s;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              send_timeout 3600s;

              # Streaming support (SSE from llama-server)
              proxy_buffering off;
              proxy_cache off;

              # Vision requests with base64 images can be large
              client_max_body_size 100M;

              location / {
                  proxy_pass http://llama_servers;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  # Retry only on connection failures, NOT on read timeout
                  # (a slow LLM generation is normal, not a proxy error)
                  proxy_next_upstream error http_502 http_503;
                  proxy_next_upstream_tries 2;
              }
          }

    - name: Enable LLM load balancer site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/llm
        dest: /etc/nginx/sites-enabled/llm
        state: link

    - name: Test nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Start and enable nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Ensure logs directory exists (start-server.sh writes pid/log files here)
      ansible.builtin.file:
        path: /home/llm/logs
        state: directory
        owner: llm
        group: llm
        mode: "0755"

    - name: Install logrotate (separate from the main apt task so a fresh
         install does not trip the driver-reboot task)
      ansible.builtin.apt:
        name: logrotate
        state: present

    # copytruncate: llama-server keeps its log fd open (nohup >>) and has no
    # rotation signal, so the file is copied to the rotated name and the
    # original truncated in place. `su llm llm` is required because the log
    # directory is not root-owned.
    - name: Deploy logrotate config for llama-server logs
      ansible.builtin.copy:
        dest: /etc/logrotate.d/llama-server
        owner: root
        group: root
        mode: "0644"
        content: |
          /home/llm/logs/*.log {
              daily
              rotate 14
              compress
              delaycompress
              missingok
              notifempty
              copytruncate
              su llm llm
          }

    # One systemd unit per GPU: start-server.sh self-daemonizes (nohup + pid file),
    # so the unit is Type=forking. The script's pre-flight kills any stale instance
    # on the port, which also makes systemctl restart behave.
    - name: Deploy llama-server systemd units (one per GPU/port)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/llama-server-{{ item.port }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=llama.cpp Vulkan server (port {{ item.port }}, GPU {{ item.device }})
          After=network-online.target mnt-models.mount
          Wants=network-online.target

          [Service]
          Type=forking
          PIDFile=/home/llm/logs/llama_server_port_{{ item.port }}.pid
          User=llm
          Group=llm
          WorkingDirectory=/home/llm
          Environment=HOME=/home/llm
          ExecStart=/home/llm/scripts/start-server.sh {{ item.api }} {{ item.port }} {{ item.context }} {{ item.device }} Qwen3.8-27B Q4 thinking mtp-vision -np 1
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      loop:
        - { port: 8001, device: 0, api: vulkan, context: 262144 }
        - { port: 8002, device: 1, api: vulkan, context: 262144 }
        - { port: 8003, device: 2, api: vulkan, context: 262144 }
        - { port: 8004, device: 3, api: vulkan, context: 262144 }

    # GPU power/perf profiles do NOT persist across VM reboots (the amdgpu driver
    # resets them), so pin them with a oneshot unit that runs on every boot,
    # ordered before the llama-server units. /usr/bin/amd-smi is used because
    # systemd does not load /etc/profile.d.
    - name: Deploy AMD GPU profile unit (COMPUTE profile + HIGH perf level at every boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/amd-gpu-profile.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=AMD GPU profile (COMPUTE power profile, HIGH perf level) on all GPUs
          After=systemd-modules-load.service
          Before=llama-server-*.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/amd-smi set -g 0 1 2 3 -P COMPUTE
          ExecStart=/usr/bin/amd-smi set -g 0 1 2 3 -l HIGH

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd to pick up the new units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable AMD GPU profile unit (runs on every VM boot)
      ansible.builtin.systemd:
        name: amd-gpu-profile
        state: started
        enabled: true

    - name: Enable and start llama-server instances (start on VM boot, restart on crash)
      ansible.builtin.systemd:
        name: "llama-server-{{ item.port }}"
        state: started
        enabled: true
      loop:
        - { port: 8001 }
        - { port: 8002 }
        - { port: 8003 }
        - { port: 8004 }

    - name: Wait for all 4 llama-server ports to come up
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 900
      loop: [8001, 8002, 8003, 8004]

    - name: Verify each server answers /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/health"
        status_code: 200
        timeout: 10
      register: llama_health
      until: llama_health.status == 200
      retries: 30
      delay: 10
      changed_when: false
      loop: [8001, 8002, 8003, 8004]

  handlers:
    - name: reload udev
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger