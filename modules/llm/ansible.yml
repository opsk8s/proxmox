    - name: Download Qwen3.8 Flash MTP
      ansible.builtin.shell: |
        # Ensure target directory exists
        mkdir -p /mnt/models

        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF/resolve/main/MTP/mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf"
        OUTPUT_FILE="/mnt/models/Qwen3.8-Flash-Next-mtp-Q4_K_M.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
             -O "${OUTPUT_FILE}" \
             "${MODEL_URL}"
      args:
        executable: /bin/bash
        # Idempotency: Only run if the file does NOT exist
        creates: /mnt/models/Qwen3.8-Flash-Next-mtp-Q4_K_M.gguf
      become: true
      become_user: llm
#
    - name: Download Qwen3.8 Vision model via wget
      ansible.builtin.shell: |
        # Ensure target directory exists
        mkdir -p /mnt/models

        # Define the direct URL for the specific GGUF file
        MODEL_URL="https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/mmproj-BF16.gguf"
        OUTPUT_FILE="/mnt/models/Qwen3.8-27B-UD-mmproj-BF16.gguf"

        # Download using wget with Authorization header
        wget --header="Authorization: Bearer {{ hf_token_result.stdout }}" \
             -O "${OUTPUT_FILE}" \
             "${MODEL_URL}"
      args:
        executable: /bin/bash
        # Idempotency: Only run if the file does NOT exist
        creates: /mnt/models/Qwen3.8-27B-UD-mmproj-BF16.gguf
      become: true
      become_user: llm

    - name: Ensure logs directory exists (start-server.sh writes pid/log files here)
      ansible.builtin.file:
        path: /home/llm/logs
        state: directory
        owner: llm
        group: llm
        mode: "0755"

    - name: Install logrotate (separate from the main apt task so a fresh
         install does not trip the driver-reboot task)
      ansible.builtin.apt:
        name: logrotate
        state: present

    # copytruncate: llama-server keeps its log fd open (nohup >>) and has no
    # rotation signal, so the file is copied to the rotated name and the
    # original truncated in place. `su llm llm` is required because the log
    # directory is not root-owned.
    - name: Deploy logrotate config for llama-server logs
      ansible.builtin.copy:
        dest: /etc/logrotate.d/llama-server
        owner: root
        group: root
        mode: "0644"
        content: |
          /home/llm/logs/*.log {
              daily
              rotate 14
              compress
              delaycompress
              missingok
              notifempty
              copytruncate
              su llm llm
          }

    # LLM log shipping to OpenSearch (llm-logs-*) was removed: local logrotate
    # above is the only retention we want. Purge the Fluent Bit shipper that
    # the former observability.yml installed so a VM provisioned before that
    # change stops shipping too.
    - name: Check for a previously installed Fluent Bit shipper
      ansible.builtin.stat:
        path: /opt/fluent-bit/bin/fluent-bit
      register: fluent_bit_shipper

    - name: Stop and disable the old Fluent Bit shipper (if present)
      ansible.builtin.systemd:
        name: fluent-bit
        state: stopped
        enabled: false
      when: fluent_bit_shipper.stat.exists

    - name: Purge the old Fluent Bit shipper and its config (if present)
      ansible.builtin.shell: |
        set -e
        apt-get purge -y fluent-bit
        rm -f /etc/systemd/system/fluent-bit.service
        systemctl daemon-reload
        rm -rf /etc/fluent-bit /var/lib/fluent-bit
      args:
        executable: /bin/bash
      when: fluent_bit_shipper.stat.exists

    # GPU power/perf profiles do NOT persist across VM reboots (the amdgpu driver
    # resets them), so pin them with a oneshot unit that runs on every boot,
    # ordered before the llama-server units. /usr/bin/amd-smi is used because
    # systemd does not load /etc/profile.d.
    - name: Deploy AMD GPU profile unit (COMPUTE profile + HIGH perf level at every boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/amd-gpu-profile.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=AMD GPU profile (COMPUTE power profile, HIGH perf level) on all GPUs
          After=systemd-modules-load.service
          Before=llama-server-*.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/amd-smi set -g 0 1 2 3 -P COMPUTE
          ExecStart=/usr/bin/amd-smi set -g 0 1 2 3 -l HIGH

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd to pick up the new units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable AMD GPU profile unit (runs on every VM boot)
      ansible.builtin.systemd:
        name: amd-gpu-profile
        state: started
        enabled: true

    # One systemd unit per GPU: start-server.sh self-daemonizes (nohup + pid file),
    # so the unit is Type=forking. The script's pre-flight kills any stale instance
    # on the port, which also makes systemctl restart behave.
    - name: Deploy llama-server systemd units (one per GPU/port)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/llama-server-{{ item.port }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=llama.cpp server (port {{ item.port }}, GPU {{ item.device }})
          After=network-online.target mnt-models.mount
          Wants=network-online.target

          [Service]
          Type=forking
          PIDFile=/home/llm/logs/llama_server_port_{{ item.port }}.pid
          User=llm
          Group=llm
          WorkingDirectory=/home/llm
          Environment=HOME=/home/llm
          ExecStart=/home/llm/scripts/start-server.sh {{ item.api }} {{ item.port }} {{ item.context }} {{ item.device }} {{ item.model }} {{ item.quant }} {{ item.temp }} {{ item.draft }} -np 1
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      loop:
        - { port: 8001, device: 0, api: rocm, context: 131072, model: Qwen3.8-27B, quant: Q6, temp: thinking, draft: mtp-vision }
        - { port: 8002, device: 1, api: rocm, context: 131072, model: Qwen3.8-27B, quant: Q6, temp: thinking, draft: mtp-vision }
        - { port: 8003, device: 2, api: rocm, context: 131072, model: Qwen3.8-27B, quant: Q6, temp: thinking, draft: mtp-vision }
        - { port: 8004, device: 3, api: rocm, context: 64000, model: Qwen2.5-Coder, quant: Q6, temp: instruct, draft: none }

    - name: Enable and start llama-server instances (start on VM boot, restart on crash)
      ansible.builtin.systemd:
        name: "llama-server-{{ item.port }}"
        state: started
        enabled: true
      loop:
        - { port: 8001 }
        - { port: 8002 }
        - { port: 8003 }
        - { port: 8004 }

    - name: Wait for all 4 llama-server ports to come up
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 900
      loop: [8001, 8002, 8003, 8004]

    - name: Verify each server answers /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item }}/health"
        status_code: 200
        timeout: 10
      register: llama_health
      until: llama_health.status == 200
      retries: 30
      delay: 10
      changed_when: false
      loop: [8001, 8002, 8003, 8004]

    # ===== Embedding server (RAG: Open WebUI -> Qdrant) =====
    # OpenAI-compatible /v1/embeddings on :8005; Open WebUI runs every
    # uploaded Knowledge document through it and stores the vectors in the
    # qdrant VM. Loaded via --embedding (embedding-only mode) rather than
    # start-server.sh, which is chat-specific (mmproj/MTP/vision flags).
    - name: Download the embedding model (Qwen3-Embedding-0.6B, official GGUF)
      ansible.builtin.get_url:
        url: "{{ embed_model_url }}"
        dest: "{{ embed_model }}"
        owner: llm
        group: llm
        mode: "0644"

    - name: Deploy the embedding server systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/llama-embed.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=llama.cpp embedding server (OpenAI-compatible /v1/embeddings, Vulkan GPU)
          After=network-online.target mnt-models.mount amd-gpu-profile.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=llm
          Group=llm
          WorkingDirectory=/home/llm
          Environment=HOME=/home/llm
          ExecStart=/home/llm/llama.cpp/build-vulkan/bin/llama-server \
            --model {{ embed_model }} \
            --alias {{ embed_alias }} \
            --embedding \
            --host 0.0.0.0 \
            --port {{ embed_port }} \
            --device Vulkan{{ embed_gpu }} \
            --n-gpu-layers 999 \
            --ctx-size 8192 \
            --batch-size 2048 \
            --ubatch-size 2048 \
            --metrics
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: restart llama-embed

    - name: Enable and start the embedding server
      ansible.builtin.systemd:
        name: llama-embed
        state: started
        enabled: true

    - name: Wait for the embedding server to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ embed_port }}"
        timeout: 300

    # Proves the load mode is really embeddings: a chat-mode server rejects
    # /v1/embeddings, and the vector length is what Open WebUI feeds Qdrant
    # as the collection dimension. With return_content, uri exposes the body
    # twice: `content` as a raw string and `json` as the parsed dict — the
    # vector has to be read from `json`.
    - name: Verify /v1/embeddings returns a vector
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ embed_port }}/v1/embeddings"
        method: POST
        body_format: json
        body:
          model: "{{ embed_alias }}"
          input: "proxmox vector store probe"
        return_content: true
        status_code: 200
        timeout: 30
      register: embed_probe
      until: embed_probe.status == 200
      retries: 30
      delay: 10
      changed_when: false

    - name: Assert the embedding vector is well-formed
      ansible.builtin.assert:
        that:
          - embed_probe.json.data | length > 0
          - embed_probe.json.data[0].embedding | length > 100
        fail_msg: >-
          /v1/embeddings answered but returned no usable vector
          ({{ embed_probe.json.data[0].embedding | default([]) | length }} dims)

    # ===== Voice mode: whisper.cpp STT (Vulkan) + Kokoro TTS (CPU) =====
    # Open WebUI talks to these as OpenAI-compatible audio endpoints:
    #   STT -> http://<llm_ip>:8085/v1/audio/transcriptions (whisper-server, English)
    #        http://<llm_ip>:8089/v1/audio/transcriptions (whisper-server, German)
    #   TTS -> http://<llm_ip>:8086/v1/audio/speech        (Kokoro, English)
    #        http://<llm_ip>:8087/v1/audio/speech        (Kokoro, German Martin)
    #        http://<llm_ip>:8088/v1/audio/speech        (Kokoro, German Victoria)
    # whisper.cpp's server is NOT OpenAI-compatible natively (its route is
    # /inference), so it is registered at /v1/audio/transcriptions via
    # --request-path/--inference-path; it still returns {"text": "..."}.
    # whisper-server needs ffmpeg to transcode the browser's webm/ogg mic
    # capture to 16k WAV; Kokoro needs espeak-ng for phonemization.
    - name: Install voice-mode prerequisites (ffmpeg, espeak-ng)
      ansible.builtin.apt:
        update_cache: true
        name:
          - ffmpeg
          - espeak-ng
        state: present

    - name: Clone whisper.cpp
      ansible.builtin.git:
        repo: 'https://github.com/ggml-org/whisper.cpp.git'
        dest: /home/llm/whisper.cpp
        version: master
      become: true
      become_user: llm

    - name: Build whisper.cpp with Vulkan (whisper-server)
      ansible.builtin.shell: |
        cmake -B build-vulkan -DGGML_VULKAN=ON -DWHISPER_BUILD_SERVER=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build build-vulkan --config Release -j$(nproc)
      args:
        chdir: /home/llm/whisper.cpp
        executable: /bin/bash
        creates: /home/llm/whisper.cpp/build-vulkan/bin/whisper-server
      become: true
      become_user: llm

    - name: Download Whisper large-v3-turbo model (f16)
      ansible.builtin.get_url:
        url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin"
        dest: /mnt/models/ggml-large-v3-turbo.bin
        owner: llm
        group: llm
        mode: "0644"

    - name: Deploy whisper-server systemd units (STT, one stock instance per language)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/whisper-server{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=whisper.cpp transcription server (STT {{ item.lang }}, Vulkan GPU)
          After=network-online.target mnt-models.mount amd-gpu-profile.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=llm
          Group=llm
          WorkingDirectory=/home/llm
          Environment=HOME=/home/llm
          # -l is pinned, not auto: large-v3-turbo's language auto-detect
          # misfires German clips to English, and Open WebUI never sends a
          # per-request language field, so this flag is the only lever.
          # --tmp-dir MUST be writable: --convert writes the upload to tmp_dir
          # (default "."), and without it the unit's CWD is / (not writable by
          # llm) so the temp file is never created and ffmpeg fails with
          # "No such file or directory" -> HTTP 500 FFmpeg conversion failed.
          ExecStart=/home/llm/whisper.cpp/build-vulkan/bin/whisper-server -m /mnt/models/ggml-large-v3-turbo.bin --host 0.0.0.0 --port {{ item.port }} --convert --tmp-dir /tmp --device 3 -l {{ item.lang }} --request-path /v1/audio --inference-path /transcriptions
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      loop: "{{ whisper_instances }}"
      loop_control:
        label: "{{ item.lang }}"
      notify: "restart whisper-server{{ item.name }}"

    - name: Clone Kokoro-FastAPI
      ansible.builtin.git:
        repo: 'https://github.com/remsky/Kokoro-FastAPI.git'
        dest: /home/llm/kokoro-fastapi
        version: master
        # clone once: .venv + downloaded models live inside the checkout, so
        # re-pulling (update=yes) would trip on "local modifications".
        update: false
      become: true
      become_user: llm

    - name: Install Kokoro-FastAPI dependencies (torch excluded)
      ansible.builtin.command:
        cmd: /home/llm/.local/bin/uv sync --extra cpu --no-install-package torch
      args:
        chdir: /home/llm/kokoro-fastapi
      become: true
      become_user: llm
      # uv sync is idempotent and self-heals a half-installed .venv, so run it
      # every time instead of gating on `creates: .venv` (which would skip the
      # sync when a previous run died partway through). torch is excluded
      # because uv sync enforces the lock (CPU torch wheel) and would revert
      # the ROCm build installed by the next task on every run.
      changed_when: false

    # ROCm PyTorch for gfx1201, replacing the lock's CPU wheel. Same index and
    # pins as the vLLM recipe (llm-scripts/build-vllm.sh). Kokoro only needs
    # torch (no torchvision/torchaudio).
    - name: Install ROCm PyTorch into the Kokoro venv (gfx1201)
      ansible.builtin.command:
        cmd: >-
          /home/llm/.local/bin/uv pip install
          --python /home/llm/kokoro-fastapi/.venv/bin/python
          --index-url https://stable.repo.amd.com/rocm/whl-next/
          "rocm[libraries,device-gfx1201]==10.0.0"
          "torch[device-gfx1201]==2.12.0+rocm10.0.0"
      become: true
      become_user: llm
      changed_when: false

    - name: Download Kokoro models and voices
      ansible.builtin.shell: |
        /home/llm/.local/bin/uv run --no-sync python docker/scripts/download_model.py --output api/src/models/v1_0
      args:
        chdir: /home/llm/kokoro-fastapi
        executable: /bin/bash
        creates: /home/llm/kokoro-fastapi/api/src/models/v1_0/kokoro-v1_0.pth
      become: true
      become_user: llm

    - name: Deploy kokoro TTS systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/kokoro.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Kokoro TTS (OpenAI-compatible /v1/audio/speech, ROCm GPU)
          After=network-online.target amd-gpu-profile.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=llm
          Group=llm
          WorkingDirectory=/home/llm/kokoro-fastapi
          Environment=HOME=/home/llm
          # Kokoro-FastAPI defaults these to Docker paths (/app/...); point
          # them at the native checkout instead. The model is downloaded to
          # api/src/models/v1_0, the voices are committed in api/src/voices/v1_0.
          Environment=MODEL_DIR=/home/llm/kokoro-fastapi/api/src/models
          Environment=VOICES_DIR=/home/llm/kokoro-fastapi/api/src/voices/v1_0
          # Kokoro picks "cuda" when USE_GPU is true and has no index setting,
          # so the card is chosen by restricting visibility (ROCm torch
          # enumerates the AMD GPU as a CUDA device).
          Environment=USE_GPU=true
          Environment=HIP_VISIBLE_DEVICES={{ kokoro_gpu }}
          # ROCm 7.14/7.15 regression: the HSA async-events loop busy-polls a
          # full CPU core (rocr::core::Runtime::AsyncEventsLoop) because the
          # profiler's interrupt signal has no backing event. Disabling HSA
          # tool/profiler registration stops the spin (99.5% -> 0.0% CPU in
          # the upstream report). Must be set before the process starts.
          Environment=HSA_TOOLS_DISABLE_REGISTER=1
          ExecStart=/home/llm/kokoro-fastapi/.venv/bin/uvicorn api.src.main:app --host 0.0.0.0 --port 8086
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: restart kokoro

    # ===== German Kokoro TTS (kikiri-tts fine-tunes, :8087 Martin / :8088 Victoria) =====
    # Base Kokoro has no lang_code 'd', so this is a second Kokoro-FastAPI
    # checkout whose venv carries the German `kokoro` + `misaki[de]` forks. The
    # two speakers share that venv; each systemd unit selects its model + voice
    # via env. Models are laid out as <MODEL_DIR>/v1_0/kokoro-v1_0.pth (the
    # path Kokoro-FastAPI hardcodes) plus the Kokoro-82M config.json beside it.
    - name: Clone Kokoro-FastAPI (German)
      ansible.builtin.git:
        repo: 'https://github.com/remsky/Kokoro-FastAPI.git'
        dest: "{{ kokoro_de_dir }}"
        version: master
        # clone once: .venv + downloaded models live inside the checkout.
        update: false
      become: true
      become_user: llm

    - name: Install German Kokoro-FastAPI dependencies (torch excluded)
      ansible.builtin.command:
        cmd: /home/llm/.local/bin/uv sync --extra cpu --no-install-package torch
      args:
        chdir: "{{ kokoro_de_dir }}"
      become: true
      become_user: llm
      # Same as the English instance: uv sync self-heals a half-built venv, and
      # torch is excluded so the next task's ROCm wheel is not reverted.
      changed_when: false

    - name: Install ROCm PyTorch into the German Kokoro venv (gfx1201)
      ansible.builtin.command:
        cmd: >-
          /home/llm/.local/bin/uv pip install
          --python {{ kokoro_de_dir }}/.venv/bin/python
          --index-url https://stable.repo.amd.com/rocm/whl-next/
          "rocm[libraries,device-gfx1201]==10.0.0"
          "torch[device-gfx1201]==2.12.0+rocm10.0.0"
      become: true
      become_user: llm
      changed_when: false

    # German G2P needs misaki[de] (DEG2P -> phonemizer-fork + espeakng-loader);
    # lang_code 'd' needs the German kokoro fork. Both are semidark forks that
    # REPLACE the stock packages uv sync just installed. misaki goes first (it
    # pulls the [de] extras); kokoro goes in --no-deps so it does NOT
    # re-resolve its declared misaki[en]/torch deps back to the PyPI stock/CPU
    # builds. The ROCm torch from the previous task satisfies kokoro's torch.
    - name: Install the German misaki[de] fork
      ansible.builtin.command:
        cmd: >-
          /home/llm/.local/bin/uv pip install
          --python {{ kokoro_de_dir }}/.venv/bin/python
          "misaki[de] @ {{ kokoro_de_misaki }}"
      become: true
      become_user: llm
      changed_when: false

    - name: Install the German kokoro fork (lang_code 'd')
      ansible.builtin.command:
        cmd: >-
          /home/llm/.local/bin/uv pip install --no-deps
          --python {{ kokoro_de_dir }}/.venv/bin/python
          "kokoro @ {{ kokoro_de_fork }}"
      become: true
      become_user: llm
      changed_when: false

    # get_url does NOT create parent directories (unlike copy/template/file),
    # so build the per-speaker trees first: model + config.json share
    # models-<name>/v1_0, the voice lives in voices-<name>.
    - name: Create the German model directories
      ansible.builtin.file:
        path: "{{ kokoro_de_dir }}/models-{{ item.name }}/v1_0"
        state: directory
        owner: llm
        group: llm
        mode: "0755"
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the German voice directories
      ansible.builtin.file:
        path: "{{ kokoro_de_dir }}/voices-{{ item.name }}"
        state: directory
        owner: llm
        group: llm
        mode: "0755"
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Download the German Kokoro models (kikiri-tts fine-tunes)
      ansible.builtin.get_url:
        url: "https://huggingface.co/{{ item.model_repo }}/resolve/main/{{ item.model_file }}"
        dest: "{{ kokoro_de_dir }}/models-{{ item.name }}/v1_0/kokoro-v1_0.pth"
        owner: llm
        group: llm
        mode: "0644"
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Download the German voicepacks
      ansible.builtin.get_url:
        url: "https://huggingface.co/{{ item.model_repo }}/resolve/main/{{ item.voice_src }}"
        dest: "{{ kokoro_de_dir }}/voices-{{ item.name }}/{{ item.voice }}.pt"
        owner: llm
        group: llm
        mode: "0644"
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    # The fine-tunes are Kokoro-82M in architecture, so the base model's
    # config.json describes them. KModel reads config.json from the model's
    # directory, so it must sit next to each kokoro-v1_0.pth.
    - name: Download the Kokoro-82M config.json (shared by the fine-tunes)
      ansible.builtin.get_url:
        url: "https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/config.json"
        dest: "{{ kokoro_de_dir }}/models-{{ item.name }}/v1_0/config.json"
        owner: llm
        group: llm
        mode: "0644"
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy the German Kokoro TTS systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/kokoro-de-{{ item.name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Kokoro TTS German - {{ item.name }} (OpenAI-compatible /v1/audio/speech, ROCm GPU)
          After=network-online.target amd-gpu-profile.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=llm
          Group=llm
          WorkingDirectory={{ kokoro_de_dir }}
          Environment=HOME=/home/llm
          Environment=MODEL_DIR={{ kokoro_de_dir }}/models-{{ item.name }}
          Environment=VOICES_DIR={{ kokoro_de_dir }}/voices-{{ item.name }}
          Environment=MODEL_REPO_ID=hexgrad/Kokoro-82M
          # Voice files are named dm_martin / dv_victoria (leading 'd' = German),
          # and DEFAULT_VOICE_CODE pins the pipeline to lang_code 'd' regardless.
          Environment=DEFAULT_VOICE={{ item.voice }}
          Environment=DEFAULT_VOICE_CODE=d
          Environment=USE_GPU=true
          Environment=HIP_VISIBLE_DEVICES={{ kokoro_gpu }}
          Environment=HSA_TOOLS_DISABLE_REGISTER=1
          ExecStart={{ kokoro_de_dir }}/.venv/bin/uvicorn api.src.main:app --host 0.0.0.0 --port {{ item.port }}
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"
      notify: "restart kokoro-de-{{ item.name }}"

    - name: Reload systemd to pick up the voice-mode units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start the whisper-server instances (STT)
      ansible.builtin.systemd:
        name: "whisper-server{{ item.name }}"
        state: started
        enabled: true
      loop: "{{ whisper_instances }}"
      loop_control:
        label: "{{ item.lang }}"

    - name: Enable and start kokoro (TTS)
      ansible.builtin.systemd:
        name: kokoro
        state: started
        enabled: true

    - name: Enable and start the German Kokoro instances
      ansible.builtin.systemd:
        name: "kokoro-de-{{ item.name }}"
        state: started
        enabled: true
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for the voice-mode ports to come up
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 300
      loop: [8085, 8086, 8087, 8088, 8089]

    # End-to-end German check: synthesize a short clip per instance and require
    # HTTP 200. model 'kokoro' is a valid name for the OpenAI-compat endpoint
    # (maps to v1_0/kokoro-v1_0.pth under MODEL_DIR); lang_code 'd' forces the
    # German pipeline; voice must match the deployed .pt file name.
    - name: Probe the German TTS instances
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port }}/v1/audio/speech"
        method: POST
        body_format: json
        body:
          model: kokoro
          input: "Hallo, dies ist ein Test der deutschen Sprachausgabe."
          voice: "{{ item.voice }}"
          lang_code: d
          response_format: mp3
        status_code: 200
        timeout: 120
      register: kokoro_de_probe
      until: kokoro_de_probe.status == 200
      retries: 10
      delay: 10
      changed_when: false
      loop: "{{ kokoro_de_instances }}"
      loop_control:
        label: "{{ item.name }}"

    # End-to-end STT round-trip: the German Kokoro instance synthesizes a
    # known German sentence and whisper-de must transcribe it back as German —
    # this catches the "German comes back as English" failure at deploy time.
    # Shell (not uri) because a binary mp3 has to travel TTS-out -> STT-in.
    - name: Probe the German STT endpoint (TTS -> STT round-trip)
      ansible.builtin.shell: |
        set -euo pipefail
        clip=/tmp/stt-de-probe.mp3
        trap 'rm -f "$clip"' EXIT
        curl -sf -X POST http://127.0.0.1:8088/v1/audio/speech \
          -H 'Content-Type: application/json' \
          -d '{"model": "kokoro", "input": "Hallo, heute ist ein schoener Tag.", "voice": "dv_victoria", "lang_code": "d", "response_format": "mp3"}' \
          -o "$clip"
        text=$(curl -sf -X POST http://127.0.0.1:8089/v1/audio/transcriptions \
          -F "file=@$clip" -F model=large-v3-turbo \
          | python3 -c 'import json, sys; print(json.load(sys.stdin)["text"])')
        echo "transcribed: $text"
        echo "$text" | grep -qi "Hallo"
      args:
        executable: /bin/bash
      register: stt_de_probe
      until: stt_de_probe.rc == 0
      retries: 3
      delay: 10
      changed_when: false

  handlers:
    - name: reload udev
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger

    - name: restart kokoro
      ansible.builtin.systemd:
        name: kokoro
        state: restarted

    - name: restart kokoro-de-martin
      ansible.builtin.systemd:
        name: kokoro-de-martin
        state: restarted

    - name: restart kokoro-de-victoria
      ansible.builtin.systemd:
        name: kokoro-de-victoria
        state: restarted

    - name: restart whisper-server
      ansible.builtin.systemd:
        name: whisper-server
        state: restarted

    - name: restart whisper-server-de
      ansible.builtin.systemd:
        name: whisper-server-de
        state: restarted

    - name: restart llama-embed
      ansible.builtin.systemd:
        name: llama-embed
        state: restarted
        daemon_reload: true