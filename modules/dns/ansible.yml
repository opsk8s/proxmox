---
- name: Deploy dnsmasq private DNS (VM)
  hosts: dns
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    # DNS-over-TLS upstreams used by Unbound.
    #
    # 1.1.1.1 / 1.0.0.1 are the network endpoints.
    # cloudflare-dns.com is the TLS authentication/SNI hostname.
    dot_forwarders:
      - "1.1.1.1@853#cloudflare-dns.com"
      - "1.0.0.1@853#cloudflare-dns.com"

    # Static records for every service in this repo.
    # All IPs arrive via extra_vars from Terraform (proxmox.tfvars).
    lan_records:
      - "address=/pve.lan/{{ pve_ip }}"
      - "address=/dns.lan/{{ dns_ip }}"
      - "address=/llm.lan/{{ llm_ip }}"
      - "address=/jenkins.lan/{{ jenkins_ip }}"
      - "address=/jenkins-agent.lan/{{ jenkins_agent_ip }}"
      - "address=/open-webui.lan/{{ open_webui_ip }}"
      - "address=/postgres.lan/{{ postgres_ip }}"
      - "address=/taiga.lan/{{ taiga_ip }}"
      - "address=/monitoring.lan/{{ monitoring_ip }}"
      - "address=/grafana.lan/{{ monitoring_ip }}"
      - "address=/prometheus.lan/{{ monitoring_ip }}"
      - "address=/elk.lan/{{ elk_ip }}"
      - "address=/kibana.lan/{{ elk_ip }}"
      - "address=/elasticsearch.lan/{{ elk_ip }}"
      # NGINX reverse proxy: nginx.lan is the box itself, app.*.lan are the
      # per-service virtual hosts (all served by nginx)
      - "address=/nginx.lan/{{ nginx_ip }}"
      - "address=/app.kibana.lan/{{ nginx_ip }}"
      - "address=/app.elk.lan/{{ nginx_ip }}"
      - "address=/app.elastic.lan/{{ nginx_ip }}"
      - "address=/app.grafana.lan/{{ nginx_ip }}"
      - "address=/app.prometheus.lan/{{ nginx_ip }}"
      - "address=/app.jenkins.lan/{{ nginx_ip }}"
      - "address=/app.open-webui.lan/{{ nginx_ip }}"
      - "address=/app.langflow.lan/{{ nginx_ip }}"
      - "address=/ui-agent.llm.lan/{{ nginx_ip }}"
      - "address=/code-swarm-agent.llm.lan/{{ nginx_ip }}"
      - "address=/code-smith-agent.llm.lan/{{ nginx_ip }}"
      - "address=/code-assistent.llm.lan/{{ nginx_ip }}"
      - "address=/stt.llm.lan/{{ nginx_ip }}"
      - "address=/stt-de.llm.lan/{{ nginx_ip }}"
      - "address=/tts.llm.lan/{{ nginx_ip }}"
      - "address=/tts-de-martin.llm.lan/{{ nginx_ip }}"
      - "address=/tts-de-victoria.llm.lan/{{ nginx_ip }}"
      - "address=/embed.llm.lan/{{ nginx_ip }}"
      - "address=/deepseek.llm.lan/{{ nginx_ip }}"
      - "address=/app.taiga.lan/{{ nginx_ip }}"
      - "address=/git.lan/{{ git_ip }}"
      - "address=/app.git.lan/{{ nginx_ip }}"
      - "address=/qdrant.lan/{{ qdrant_ip }}"
      - "address=/app.qdrant.lan/{{ nginx_ip }}"

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: dns

    - name: Install dnsmasq, unbound and dig
      ansible.builtin.apt:
        update_cache: true
        name:
          - dnsmasq
          - unbound
          - dnsutils
        state: present

    # dnsmasq owns port 53.
    # Disable systemd-resolved's stub listener on 127.0.0.53:53.
    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Disable systemd-resolved stub listener
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/no-stub.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Resolve]
          DNSStubListener=no
      register: resolved_stub

    - name: Apply resolved stub change
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: resolved_stub.changed

    # ------------------------------------------------------------------
    # Unbound
    # ------------------------------------------------------------------

    - name: Ensure unbound state directory exists
      ansible.builtin.file:
        path: /var/lib/unbound
        state: directory
        owner: unbound
        group: unbound
        mode: "0755"

    - name: Check whether the root trust-anchor file exists
      ansible.builtin.stat:
        path: /var/lib/unbound/root.autotrust
      register: autotrust

    - name: Seed root trust anchor from distro root.ds
      ansible.builtin.copy:
        src: /usr/share/dns/root.ds
        dest: /var/lib/unbound/root.autotrust
        remote_src: true
        owner: unbound
        group: unbound
        mode: "0644"
      when:
        - not autotrust.stat.exists or
          autotrust.stat.size | default(0) == 0

    - name: Deploy unbound config
      ansible.builtin.copy:
        dest: /etc/unbound/unbound.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible.
          #
          # dnsmasq owns :53.
          # Unbound listens only on 127.0.0.1:5353.
          # Unbound forwards all non-local DNS over TLS to Cloudflare.

          server:
              username: unbound
              directory: /etc/unbound

              # per-query-type and per-rcode counters for the metrics
              # collector (absent from plain stats_noreset output otherwise)
              extended-statistics: yes

              auto-trust-anchor-file: /var/lib/unbound/root.autotrust

              # Required for forwarder certificate verification (auth-name
              # in forward-addr): without it unbound has no trust anchors
              # and every DoT handshake fails with "self-signed certificate
              # in certificate chain".
              tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

              interface: 127.0.0.1
              port: 5353

              access-control: 127.0.0.1/32 allow

          # Loopback-only control channel so unbound-control (metrics
          # collector on this host) can query stats. Uses the distro unix
          # socket /run/unbound.ctl — NOT the TCP channel: the latter needs
          # TLS key/cert files that Ubuntu's AppArmor profile for unbound
          # (enforce) denies the daemon from loading (dac_override denied,
          # unbound refuses to start). The socket needs no keys and matches
          # the profile (/run/unbound.ctl rw).
          remote-control:
              control-enable: yes
              control-interface: /run/unbound.ctl

          forward-zone:
              name: "."
              forward-tls-upstream: yes

          {% for forwarder in dot_forwarders %}
              forward-addr: {{ forwarder }}
          {% endfor %}
      register: unbound_config

    - name: Check unbound config syntax
      ansible.builtin.command:
        cmd: unbound-checkconf
      changed_when: false

    # Apply Unbound before dnsmasq starts/restarts.
    - name: Restart unbound with final configuration
      ansible.builtin.systemd:
        name: unbound
        state: restarted
      when: unbound_config.changed

    - name: Enable and start unbound
      ansible.builtin.systemd:
        name: unbound
        state: started
        enabled: true

    - name: Verify unbound-control answers
      ansible.builtin.command:
        cmd: unbound-control status
      register: unbound_control_status
      changed_when: false
      failed_when: unbound_control_status.rc != 0

    # ------------------------------------------------------------------
    # dnsmasq
    # ------------------------------------------------------------------

    - name: Ensure dnsmasq config directory exists
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy dnsmasq upstream + domain policy
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/upstream.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible.
          #
          # Do not read /etc/resolv.conf.
          no-resolv

          # Forward all non-local DNS to local Unbound.
          # Unbound performs DNS-over-TLS to Cloudflare.
          server=127.0.0.1#5353

          # .lan is local and must never be sent upstream.
          local=/lan/

          # Keep the router's own domain resolving through the router.
          server=/w8s.local/{{ lan_gateway }}

          # Do not forward single-label names.
          domain-needed

          # Do not accept bogus RFC1918 answers from upstream.
          bogus-priv
      register: dnsmasq_upstream

    - name: Deploy static .lan records
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/lan-records.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          {% for record in lan_records %}
          {{ record }}
          {% endfor %}
      register: dnsmasq_records

    - name: Check dnsmasq config syntax
      ansible.builtin.command:
        cmd: dnsmasq --test
      changed_when: false

    - name: Restart dnsmasq with final configuration
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
      when: dnsmasq_upstream.changed or dnsmasq_records.changed

    - name: Enable and start dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: started
        enabled: true

    # ------------------------------------------------------------------
    # Basic service checks
    # ------------------------------------------------------------------

    - name: Check Unbound is listening on 127.0.0.1:5353
      ansible.builtin.command:
        cmd: ss -lnup
      register: unbound_socket
      changed_when: false

    - name: Fail if Unbound is not listening on port 5353
      ansible.builtin.fail:
        msg: "Unbound is not listening on 127.0.0.1:5353"
      when: "'127.0.0.1:5353' not in unbound_socket.stdout"

    - name: Check dnsmasq is listening on port 53
      ansible.builtin.command:
        cmd: ss -lnup
      register: dnsmasq_socket
      changed_when: false

    - name: Fail if dnsmasq is not listening on port 53
      ansible.builtin.fail:
        msg: "dnsmasq is not listening on DNS port 53"
      when: "':53' not in dnsmasq_socket.stdout"


# ----------------------------------------------------------------------
# Verification
# ----------------------------------------------------------------------

- name: Verify DNS resolution
  hosts: dns
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Check a static .lan record
      ansible.builtin.command:
        cmd: dig +short postgres.lan @127.0.0.1
      register: lan_check
      changed_when: false

    - name: Fail when static record does not resolve correctly
      ansible.builtin.fail:
        msg: >-
          expected {{ postgres_ip }} for postgres.lan,
          got: {{ lan_check.stdout_lines | join(',') }}
      when: postgres_ip not in lan_check.stdout_lines

    # This query exercises:
    #
    # dnsmasq :53
    #     ↓
    # Unbound :5353
    #     ↓
    # Cloudflare DNS-over-TLS :853
    #
    # It therefore validates the actual production path.
    - name: Check encrypted upstream forwarding
      ansible.builtin.command:
        cmd: dig +short example.com @127.0.0.1
      register: upstream_check
      changed_when: false
      retries: 6
      delay: 5
      until:
        - upstream_check.rc == 0
        - upstream_check.stdout_lines | default([]) | length > 0

    - name: Show encrypted upstream result
      ansible.builtin.debug:
        msg:
          - "postgres.lan -> {{ lan_check.stdout_lines }}"
