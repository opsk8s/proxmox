---
# Reverse proxy for every service in this repo:
#   app.kibana.lan / app.elk.lan       -> elk:5601
#   app.elastic.lan                    -> elk:9200
#   app.grafana.lan                    -> monitoring:3000
#   app.prometheus.lan                 -> monitoring:9090
#   app.jenkins.lan                    -> jenkins:8080
#   app.open-webui.lan                 -> open-webui:8080
#   app.llm.lan                        -> llm:8001-8004 (round robin)
#   deepseek.llm.lan                   -> api.deepseek.com (TLS upstream, body capture)
#   app.taiga.lan                      -> taiga:8000/8003/8080/8888 (per-location)
#
# Every request is recorded with the json_analytics log format (one JSON
# object per line). Fluent Bit on this VM ships /var/log/nginx/access.log to
# OpenSearch on the ELK VM (indices nginx-access-*, 14d ISM retention — both
# owned by modules/elk/ansible.yml).
#
# Shipper history: Filebeat was replaced on 2026-09-06. Beats >=7.13 run an
# unconditional on-connect license probe (GET /_license) that OpenSearch
# answers with 400, so Filebeat refuses to connect; beats <=7.12 predate
# filestream and 7.10.2 segfaults on Ubuntu 26.04 (kernel 7.0). Fluent Bit
# has a native opensearch output and is the OpenSearch-recommended shipper.
- name: Deploy NGINX reverse proxy (VM)
  hosts: nginx
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # All service IPs arrive via extra_vars from Terraform (proxmox.tfvars)

    # --- http-context config ---------------------------------------------------
    # log_format json_analytics: one JSON object per request. escape=json
    # keeps the line valid JSON when $request/$http_user_agent contain quotes.
    # access_log is set globally (http context) so every vhost — including
    # the default_server catch-all — is recorded.
    logging_config: |
      log_format json_analytics escape=json '{'
          '"host":"$host",'
          '"time_local":"$time_local",'
          '"remote_addr":"$remote_addr",'
          '"remote_user":"$remote_user",'
          '"request":"$request",'
          '"status": "$status",'
          '"body_bytes_sent":"$body_bytes_sent",'
          '"request_time":"$request_time",'
          '"http_referrer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_x_forwarded_for":"$http_x_forwarded_for",'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_status":"$upstream_status",'
          '"request_id":"$request_id"'
      '}';

      access_log /var/log/nginx/access.log json_analytics;

    # WebSocket upgrade handshake (Jenkins agent tunnel, Kibana, Grafana,
    # Open WebUI, llama-server webui) needs Connection: upgrade only when
    # the client sent Upgrade: websocket — hence the map.
    websocket_config: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      close;
      }

    # --- LAN TLS (local CA for the .lan names) ----------------------------------
    # .lan is private DNS (modules/dns), so no public CA can issue for it. A
    # 10-year CA root lives in /etc/lan-ca and is trusted once per client
    # device (Mac keychain, iOS profile, ...). It signs a single 730d leaf
    # covering every server_name in this play; lan-cert-renew.sh regenerates
    # it when it is missing, the SAN list drifts, or it expires within 60
    # days — a daily timer runs the same script unattended.
    lan_ca_dir: /etc/lan-ca
    lan_cert_dir: /etc/nginx/certs
    lan_https_domains:
      - app.kibana.lan
      - app.elk.lan
      - app.elastic.lan
      - app.grafana.lan
      - app.prometheus.lan
      - app.jenkins.lan
      - app.open-webui.lan
      - app.llm.lan
      - stt.llm.lan
      - tts.llm.lan
      - deepseek.llm.lan
      - app.taiga.lan
      - app.git.lan
      - app.qdrant.lan

    # ssl_certificate is valid in the http context, so every vhost inherits
    # the same leaf — vhosts only need `listen 443 ssl;`.
    ssl_config: |
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_certificate /etc/nginx/certs/lan.crt;
      ssl_certificate_key /etc/nginx/certs/lan.key;
      add_header Strict-Transport-Security "max-age=31536000" always;

    cert_renew_script: |
      #!/usr/bin/env bash
      # Regenerate the LAN leaf cert when it is missing, its SAN list has
      # drifted from /etc/lan-ca/domains, or it expires within 60 days.
      # Prints "ok" or "regenerated (<reason>)".
      set -euo pipefail
      CA_DIR=/etc/lan-ca
      CERT_DIR=/etc/nginx/certs
      CERT="$CERT_DIR/lan.crt"
      KEY="$CERT_DIR/lan.key"
      WANTED=$(xargs < "$CA_DIR/domains")
      need=""
      if [ ! -s "$CERT" ] || [ ! -s "$KEY" ]; then
        need=missing
      elif ! openssl x509 -in "$CERT" -noout -checkend $((60 * 86400)); then
        need=expiring
      else
        CERT_SANS=$(openssl x509 -in "$CERT" -noout -ext subjectAltName | awk 'NR==2' \
          | sed 's/DNS://g; s/,/ /g' | tr ' ' '\n' | sed '/^$/d' | sort)
        WANTED_SANS=$(echo "$WANTED" | tr ' ' '\n' | sort)
        if [ "$CERT_SANS" != "$WANTED_SANS" ]; then
          need=san-drift
        fi
      fi
      if [ -n "$need" ]; then
        mkdir -p "$CERT_DIR"
        chmod 700 "$CERT_DIR"
        openssl genrsa -out "$KEY" 2048
        chmod 600 "$KEY"
        openssl req -new -key "$KEY" -out "$CA_DIR/lan.csr" -subj "/CN=app.lan"
        {
          echo "subjectAltName=$(echo "$WANTED" | tr ' ' '\n' | sed 's/^/DNS:/' | paste -sd, -)"
          echo "keyUsage=digitalSignature,keyEncipherment"
          echo "extendedKeyUsage=serverAuth"
        } > "$CA_DIR/san.cnf"
        openssl x509 -req -in "$CA_DIR/lan.csr" -CA "$CA_DIR/ca.pem" -CAkey "$CA_DIR/ca.key" \
          -CAcreateserial -days 730 -sha256 -extfile "$CA_DIR/san.cnf" -out "$CERT"
        # nginx reads its cert at startup/reload — pick up the new leaf now
        # (no-op on first runs, before the service exists).
        if systemctl is-active --quiet nginx; then
          nginx -t && systemctl reload nginx
        fi
        echo "regenerated ($need)"
      else
        echo "ok"
      fi

    # --- virtual hosts -----------------------------------------------------------
    default_vhost: |
      server {
          listen 80 default_server;
          listen 443 ssl default_server;
          server_name _;

          # LAN CA distribution point: the VM playbooks in this repo fetch
          # the CA root over plain http (they cannot trust the TLS leaf
          # yet) and install it in their trust store. The exact match wins
          # over location /, so the http->https redirect below never
          # applies to it. The shared token (x-lan-ca-token header, value
          # from proxmox.tfvars) guards the endpoint — no header, wrong
          # header: 403.
          location = /lan-ca.pem {
              if ($http_x_lan_ca_token != "{{ lan_ca_token }}") {
                  return 403;
              }
              alias /var/www/lan-ca.pem;
              default_type application/x-pem-file;
          }

          # Every other vhost listens on 443 only, so this catch-all also
          # owns plain HTTP for the known names: upgrade in place.
          location / {
              if ($scheme = http) {
                  return 301 https://$host$request_uri;
              }

              return 200 "nginx proxy alive\n";
              add_header Content-Type text/plain;
          }
      }

    kibana_vhost: |
      server {
          listen 443 ssl;
          server_name app.kibana.lan app.elk.lan;

          location / {
              proxy_pass http://{{ elk_ip }}:5601;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    elasticsearch_vhost: |
      server {
          listen 443 ssl;
          server_name app.elastic.lan;

          location / {
              proxy_pass http://{{ elk_ip }}:9200;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

    grafana_vhost: |
      server {
          listen 443 ssl;
          server_name app.grafana.lan;

          location / {
              proxy_pass http://{{ monitoring_ip }}:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    prometheus_vhost: |
      server {
          listen 443 ssl;
          server_name app.prometheus.lan;

          location / {
              proxy_pass http://{{ monitoring_ip }}:9090;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

    jenkins_vhost: |
      server {
          listen 443 ssl;
          server_name app.jenkins.lan;

          location / {
              proxy_pass http://{{ jenkins_ip }}:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              # long-lived: agent sessions and builds stream for minutes
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
          }
      }

    open_webui_vhost: |
      server {
          listen 443 ssl;
          server_name app.open-webui.lan;

          location / {
              proxy_pass http://{{ open_webui_ip }}:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    # Qdrant: REST API + web UI + /metrics on :6333 (gRPC :6334 stays LAN-
    # direct, nginx does no grpc_pass). Clients send the api-key header;
    # nginx does no auth of its own. Raised body limit for bulk upserts.
    qdrant_vhost: |
      server {
          listen 443 ssl;
          server_name app.qdrant.lan;

          client_max_body_size 256M;

          location / {
              proxy_pass http://{{ qdrant_ip }}:6333;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    git_vhost: |
      server {
          listen 443 ssl;
          server_name app.git.lan;

          client_max_body_size 512M;

          location / {
              proxy_pass http://{{ git_ip }}:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    # The taiga VM runs back (:8000), protected (:8003), a static server
    # (:8080: front + django static + media) and events (:8888). /_protected/
    # is the X-Accel-Redirect target emitted by the protected service for
    # /media/ requests — nginx resolves it via the location below, which
    # proxies back to the static server that streams the file locally.
    taiga_vhost: |
      server {
          listen 443 ssl;
          server_name app.taiga.lan;

          client_max_body_size 100M;
          charset utf-8;

          # Frontend (SPA)
          location / {
              proxy_pass http://{{ taiga_ip }}:8080/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # API
          location /api/ {
              proxy_pass http://{{ taiga_ip }}:8000/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Admin
          location /admin/ {
              proxy_pass http://{{ taiga_ip }}:8000/admin/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Django static files
          location /static/ {
              proxy_pass http://{{ taiga_ip }}:8080/static/;
          }

          # Unprotected media exports
          location /media/exports/ {
              proxy_pass http://{{ taiga_ip }}:8080/media/exports/;
          }

          # Protected media — the protected service answers with
          # X-Accel-Redirect: /_protected/<file>, which nginx resolves
          # against the location below.
          location /media/ {
              proxy_pass http://{{ taiga_ip }}:8003/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # X-Accel-Redirect target of the protected service
          location /_protected/ {
              internal;
              proxy_pass http://{{ taiga_ip }}:8080/_protected/;
          }

          # Events (websocket; the client lives for days, so long timeouts)
          location /events {
              proxy_pass http://{{ taiga_ip }}:8888/events;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_connect_timeout 7d;
              proxy_send_timeout 7d;
              proxy_read_timeout 7d;
          }
      }

    # llama-server: round robin over the four per-GPU instances. Buffering is
    # off so SSE token streams are flushed to the client as they arrive.
    llm_vhost: |
      upstream llm_pool {
          server {{ llm_ip }}:8001;
          server {{ llm_ip }}:8002;
          server {{ llm_ip }}:8003;
          server {{ llm_ip }}:8004;
      }

      server {
          listen 443 ssl;
          server_name app.llm.lan;
          # nginx default is 1M: agentic clients (multi-turn context, vision
          # images, tool payloads) outgrow it fast. Same 100M as app-taiga.
          # 2026-09-08 saw "client intended to send too large body" 413s at
          # 1.6M/172M while an agentic CLI session was pushing big contexts.
          client_max_body_size 100M;

          location / {
              proxy_pass http://llm_pool;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              # Tracing: hand the upstream a stable per-request id and echo
              # it (plus the serving instance) back in the response.
              # request_id already links nginx-access-* to the
              # llm-request-body-* / llm-response-body-* captures via the
              # same $request_id; X-Upstream exposes which llama-server
              # instance (llm_pool round-robin) actually served the request.
              proxy_set_header X-Request-Id $request_id;
              # local add_headers disable http-context inheritance, so the
              # HSTS header must be repeated here
              add_header Strict-Transport-Security "max-age=31536000" always;
              add_header X-Request-Id $request_id always;
              add_header X-Upstream $upstream_addr always;
              proxy_buffering off;
              # generations can run for minutes
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;

              # Capture request + response bodies of JSON API POSTs, parsed
              # into two structured lines per request (llm-request.log /
              # llm-response.log, shipped to llm-request-body-* /
              # llm-response-body-* on the ELK VM). The script is
              # phase-switched (access/body_filter/log) and pcall-guarded so
              # a capture failure never breaks the proxy. Correlate with
              # nginx-access-* analytics via request_id.
              access_by_lua_file      /etc/nginx/lua/body-capture.lua;
              body_filter_by_lua_file /etc/nginx/lua/body-capture.lua;
              log_by_lua_file         /etc/nginx/lua/body-capture.lua;
          }
      }

    # Voice-mode audio services on the LLM VM: whisper.cpp STT on 8085
    # (OpenAI-compatible /v1/audio/transcriptions) and Kokoro-FastAPI TTS on
    # 8086 (/v1/audio/speech). Each gets its own .lan name so Open WebUI can
    # reach it over the same trusted TLS as app.llm.lan. proxy_pass has no
    # URI part, so the original path is forwarded unchanged.
    stt_vhost: |
      server {
          listen 443 ssl;
          server_name stt.llm.lan;
          # browser mic captures (webm/ogg) are a few MB
          client_max_body_size 100M;

          location / {
              proxy_pass http://{{ llm_ip }}:8085;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              add_header Strict-Transport-Security "max-age=31536000" always;
              # long clips + ffmpeg transcode on the upstream
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    tts_vhost: |
      server {
          listen 443 ssl;
          server_name tts.llm.lan;

          location / {
              proxy_pass http://{{ llm_ip }}:8086;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              add_header Strict-Transport-Security "max-age=31536000" always;
              # Kokoro can stream audio; don't buffer it
              proxy_buffering off;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

    # DeepSeek API proxied over the same trusted TLS and body capture as
    # app.llm.lan. It is OpenAI-compatible, so the lua capture parses
    # requests/responses (SSE included) into the same llm-request.log /
    # llm-response.log; documents carry host=deepseek.llm.lan. proxy_pass
    # has no URI part, so /v1/... paths reach the API unchanged. The
    # upstream is public TLS: Host must stay api.deepseek.com (not $host)
    # and SNI must be on for the handshake. The client's Authorization
    # header passes through untouched; the capture never stores it.
    deepseek_vhost: |
      server {
          listen 443 ssl;
          server_name deepseek.llm.lan;
          # Same ceiling as app.llm.lan: agentic clients push big contexts
          client_max_body_size 100M;

          location / {
              proxy_pass https://api.deepseek.com;
              proxy_http_version 1.1;
              proxy_ssl_protocols TLSv1.2 TLSv1.3;
              proxy_ssl_server_name on;
              proxy_set_header Host api.deepseek.com;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              # local add_headers disable http-context inheritance, so the
              # HSTS header must be repeated here
              add_header Strict-Transport-Security "max-age=31536000" always;
              # generations can run for minutes; SSE must not be buffered
              proxy_buffering off;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;

              # Same capture as app.llm.lan: request + response bodies of
              # JSON API POSTs into llm-request.log / llm-response.log
              # (shipped to llm-request-body-* / llm-response-body-*).
              access_by_lua_file      /etc/nginx/lua/body-capture.lua;
              body_filter_by_lua_file /etc/nginx/lua/body-capture.lua;
              log_by_lua_file         /etc/nginx/lua/body-capture.lua;
          }
      }

    # --- Fluent Bit (nginx access log -> OpenSearch) ---------------------------
    # The access log is one JSON object per line; the json parser merges the
    # keys at the record root (the vhost lives in "host"). Numeric fields
    # arrive as STRINGS ("0.000", "200") and upstream_response_time is "" for
    # the default vhost — they are coerced on the OpenSearch side by the
    # nginx-access index template mappings (ignore_malformed), see
    # modules/elk/ansible.yml. @timestamp = Fluent Bit read time; the
    # proxies are live so read time and log time agree within seconds.
    fluent_conf: |
      [SERVICE]
          Flush         1
          Daemon        Off
          Log_Level     info
          Parsers_File  parsers.conf
          HTTP_Server   On
          HTTP_Listen   127.0.0.1
          HTTP_Port     2020

      [INPUT]
          Name         tail
          Tag          nginx
          Path         /var/log/nginx/access.log
          Exclude_Path *log.*
          DB           /var/lib/fluent-bit/fluent-bit.db
          Parser       nginx_json

      [FILTER]
          Name    modify
          Match   nginx
          Set     source nginx

      [OUTPUT]
          Name               opensearch
          Match              nginx
          Host               {{ elk_ip }}
          Port               9200
          # strftime is applied per flush → nginx-access-YYYY.MM.DD, matching
          # the nginx-access-* index template / ISM policy on the ELK VM
          Index              nginx-access-%Y.%m.%d
          Suppress_Type_Name On

      [INPUT]
          Name         tail
          Tag          llm-request
          Path         /var/log/nginx/llm-request.log
          DB           /var/lib/fluent-bit/fluent-bit-llm-request.db
          Parser       nginx_json
          # A capture line embeds the FULL request body as one JSON record
          # (single line). The default 32K tail buffer cannot hold it:
          # Fluent Bit then logs "requires a larger buffer size, lines are
          # too long. Skipping file." and never advances past the offending
          # line (offset DB freezes). body-capture.lua caps a single body at
          # 64M (MAX_ACCUM) and escaping can inflate that by ~2x, hence the
          # 128M ceiling.
          Buffer_Chunk_Size  4M
          Buffer_Max_Size    128M

      [FILTER]
          Name    modify
          Match   llm-request
          Set     source llm-request-body

      [OUTPUT]
          Name               opensearch
          Match              llm-request
          Host               {{ elk_ip }}
          Port               9200
          # strftime is applied per flush → llm-request-body-YYYY.MM.DD (own
          # index template + 90d ISM policy on the ELK VM)
          Index              llm-request-body-%Y.%m.%d
          Suppress_Type_Name On

      [INPUT]
          Name         tail
          Tag          llm-response
          Path         /var/log/nginx/llm-response.log
          DB           /var/lib/fluent-bit/fluent-bit-llm-response.db
          Parser       nginx_json
          # Same oversized-line rationale as llm-request; streaming
          # responses are the ones that actually reach the 64M cap.
          Buffer_Chunk_Size  4M
          Buffer_Max_Size    128M

      [FILTER]
          Name    modify
          Match   llm-response
          Set     source llm-response-body

      [OUTPUT]
          Name               opensearch
          Match              llm-response
          Host               {{ elk_ip }}
          Port               9200
          # strftime is applied per flush → llm-response-body-YYYY.MM.DD (own
          # index template + 90d ISM policy on the ELK VM)
          Index              llm-response-body-%Y.%m.%d
          Suppress_Type_Name On

    # logrotate for the two lua capture logs (see body-capture.lua): one
    # parsed JSON line per request per file. copytruncate so nginx keeps
    # writing to its open handle.
    logrotate_bodies_conf: |
      /var/log/nginx/llm-request.log /var/log/nginx/llm-response.log {
          daily
          rotate 7
          copytruncate
          compress
          missingok
          notifempty
          create 0640 www-data adm
      }

    parsers_conf: |
      [PARSER]
          Name   nginx_json
          Format json

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: nginx-ubuntu

    - name: Install nginx
      ansible.builtin.apt:
        update_cache: true
        name:
          - nginx
        state: present

    # Response-body capture on the llm vhost needs ngx_http_lua_module
    # (body_filter_by_lua_file). Ubuntu ships it as a module package that
    # self-registers under /etc/nginx/modules-enabled. lua-cjson provides
    # cjson.safe for the JSON encoding in the capture script.
    - name: Install lua module for nginx (body capture)
      ansible.builtin.apt:
        update_cache: false
        name:
          - libnginx-mod-http-lua
          - lua-cjson
        state: present
      notify: restart nginx

    # The distro default site owns 80 default_server and would collide with
    # ours — remove it.
    - name: Remove distro default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Deploy JSON access log format (http context)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/10-logging.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ logging_config }}"

    - name: Deploy websocket upgrade map (http context)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/20-websocket.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ websocket_config }}"

    - name: Deploy TLS configuration (http context)
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/30-ssl.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ ssl_config }}"
      notify: restart nginx

    # --- LAN TLS: local CA + leaf cert -------------------------------------------
    # .lan is private DNS, so the CA root is ours and clients trust it once
    # (Mac keychain, iOS profile, ...). The leaf is signed for every
    # server_name in this play and renewed unattended by the daily timer.
    - name: Create the LAN CA directory
      ansible.builtin.file:
        path: "{{ lan_ca_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate the LAN CA (first run only)
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ lan_ca_dir }}
        openssl genrsa -out ca.key 4096
        chmod 600 ca.key
        openssl req -x509 -new -key ca.key -sha256 -days 3650 \
          -subj "/CN=LAN Home CA" -out ca.pem
      args:
        creates: "{{ lan_ca_dir }}/ca.pem"

    # Workers run as www-data and cannot read /etc/lan-ca (0700) — publish a
    # world-readable copy of the public root for the /lan-ca.pem endpoint.
    - name: Publish the CA root for automated client installs
      ansible.builtin.copy:
        src: "{{ lan_ca_dir }}/ca.pem"
        dest: /var/www/lan-ca.pem
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    - name: Deploy the SAN domain list for the leaf cert
      ansible.builtin.copy:
        dest: "{{ lan_ca_dir }}/domains"
        owner: root
        group: root
        mode: "0644"
        content: "{{ lan_https_domains | join('\n') + '\n' }}"

    - name: Deploy the cert renewal script
      ansible.builtin.copy:
        dest: /usr/local/bin/lan-cert-renew.sh
        owner: root
        group: root
        mode: "0755"
        content: "{{ cert_renew_script }}"

    - name: Ensure the leaf cert exists, matches the SAN list, is not expiring
      ansible.builtin.command:
        cmd: /usr/local/bin/lan-cert-renew.sh
      register: lan_cert
      changed_when: "'regenerated' in lan_cert.stdout"
      # no handler needed: the script reloads nginx itself when it renews,
      # and the explicit restart later in the play covers first runs

    - name: Deploy the daily cert renewal units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: lan-cert-renew.service
          content: |
            [Unit]
            Description=Renew the *.lan leaf certificate if needed
            After=network.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/lan-cert-renew.sh
        - name: lan-cert-renew.timer
          content: |
            [Unit]
            Description=Daily renewal of the *.lan leaf certificate

            [Timer]
            OnCalendar=daily
            Persistent=true

            [Install]
            WantedBy=timers.target

    - name: Enable the daily cert renewal timer
      ansible.builtin.systemd:
        name: lan-cert-renew.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Deploy virtual hosts
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/{{ item.file }}"
        owner: root
        group: root
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - { file: "00-default.conf", content: "{{ default_vhost }}" }
        - { file: "app-kibana.conf", content: "{{ kibana_vhost }}" }
        - { file: "app-elasticsearch.conf", content: "{{ elasticsearch_vhost }}" }
        - { file: "app-grafana.conf", content: "{{ grafana_vhost }}" }
        - { file: "app-prometheus.conf", content: "{{ prometheus_vhost }}" }
        - { file: "app-jenkins.conf", content: "{{ jenkins_vhost }}" }
        - { file: "app-open-webui.conf", content: "{{ open_webui_vhost }}" }
        - { file: "app-llm.conf", content: "{{ llm_vhost }}" }
        - { file: "stt-llm.conf", content: "{{ stt_vhost }}" }
        - { file: "tts-llm.conf", content: "{{ tts_vhost }}" }
        - { file: "deepseek-llm.conf", content: "{{ deepseek_vhost }}" }
        - { file: "app-taiga.conf", content: "{{ taiga_vhost }}" }
        - { file: "app-git.conf", content: "{{ git_vhost }}" }
        - { file: "app-qdrant.conf", content: "{{ qdrant_vhost }}" }
      notify: restart nginx

    - name: Enable virtual hosts
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item }}"
        dest: "/etc/nginx/sites-enabled/{{ item }}"
        state: link
      loop:
        - 00-default.conf
        - app-kibana.conf
        - app-elasticsearch.conf
        - app-grafana.conf
        - app-prometheus.conf
        - app-jenkins.conf
        - app-open-webui.conf
        - app-llm.conf
        - stt-llm.conf
        - tts-llm.conf
        - deepseek-llm.conf
        - app-taiga.conf
        - app-git.conf
        - app-qdrant.conf

    # The distro nginx.conf also declares `access_log /var/log/nginx/access.log;`
    # in the http context — with the json_analytics directive pointing at the
    # same path every request would be logged twice (combined lines
    # interleaved with JSON, which Filebeat cannot decode).
    - name: Disable the distro default access_log (JSON log owns that path)
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^\s*access_log /var/log/nginx/access\.log;\s*$'
        line: '# disabled: /etc/nginx/conf.d/10-logging.conf writes the JSON access log to this path'
      notify: restart nginx

    # --- Body capture (llm vhost request/response bodies) ----------------------
    - name: Create lua directory for the body capture script
      ansible.builtin.file:
        path: /etc/nginx/lua
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy body capture script (llm vhost)
      ansible.builtin.copy:
        src: files/body-capture.lua
        dest: /etc/nginx/lua/body-capture.lua
        owner: root
        group: root
        mode: "0644"
      notify: restart nginx

    - name: Ensure the body capture logs exist and are writable by nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        owner: www-data
        group: adm
        mode: "0640"
      loop:
        - /var/log/nginx/llm-request.log
        - /var/log/nginx/llm-response.log

    - name: Deploy logrotate for the body capture logs
      ansible.builtin.copy:
        dest: /etc/logrotate.d/nginx-bodies
        owner: root
        group: root
        mode: "0644"
        content: "{{ logrotate_bodies_conf }}"

    - name: Check nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

    # Notified restart handlers only flush at play END, so every
    # verification below would otherwise probe a still-old nginx. Restart
    # explicitly here so the http→https redirect, TLS and body-capture
    # probes all run against the config we just wrote.
    - name: Restart nginx to load the freshly deployed configuration
      ansible.builtin.systemd:
        name: nginx
        state: restarted

    - name: Wait for nginx to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 60

    - name: Verify the default server redirects http to https
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: 301
        follow_redirects: none
        timeout: 10
      register: nginx_default
      until: nginx_default.status == 301
      retries: 10
      delay: 3
      changed_when: false

    - name: Verify the default server answers over https
      ansible.builtin.uri:
        url: "https://127.0.0.1/"
        status_code: 200
        validate_certs: false
        timeout: 10
      register: nginx_default_https
      until: nginx_default_https.status == 200
      retries: 10
      delay: 3
      changed_when: false

    - name: "Verify a vhost proxies over https (Host: app.kibana.lan)"
      ansible.builtin.uri:
        url: "https://127.0.0.1/api/status"
        headers:
          Host: app.kibana.lan
        status_code: [200]
        validate_certs: false
        timeout: 30
      register: nginx_kibana
      until: nginx_kibana.status == 200
      retries: 30
      delay: 10
      changed_when: false

    # 401 (missing api-key header) can only come from the qdrant backend's
    # auth middleware, which proves the vhost routes to qdrant instead of
    # the default server (which answers 200). 403 would mean a key was
    # presented but invalid — we send no key, so qdrant answers 401.
    - name: "Verify the qdrant vhost proxies over https (Host: app.qdrant.lan)"
      ansible.builtin.uri:
        url: "https://127.0.0.1/collections"
        headers:
          Host: app.qdrant.lan
        status_code: [401]
        validate_certs: false
        timeout: 10
      register: nginx_qdrant
      until: nginx_qdrant.status == 401
      retries: 30
      delay: 10
      changed_when: false

    # Any HTTP response works (even a 4xx/502 from llama) — the capture hooks
    # in the llm location run on POST+json requests regardless of status, so a
    # match in llm-request.log proves the lua script ran end to end (bodies.log
    # was the pre-2026-09-08 single-file format; the split capture writes
    # llm-request.log / llm-response.log).
    - name: Verify body capture records a JSON POST through the llm vhost
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sk -o /dev/null -X POST -H 'Host: app.llm.lan' \
          -H 'Content-Type: application/json' \
          --data '{"capture_probe":true}' \
          https://127.0.0.1/health
        sleep 2
        grep -q capture_probe /var/log/nginx/llm-request.log
      args:
        executable: /bin/bash
      changed_when: false

    # No API key: DeepSeek answers 401, but the capture hooks run
    # regardless of upstream status, so a captured line for the vhost
    # proves the proxy (TLS + SNI + Host rewrite) and the lua hooks
    # work end to end. Tolerate a slow/dead upstream: a 502 still
    # produces a capture line, curl gives up at 90s.
    - name: Verify body capture records a JSON POST through the deepseek vhost
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sk -o /dev/null --max-time 90 -X POST -H 'Host: deepseek.llm.lan' \
          -H 'Content-Type: application/json' \
          --data '{"capture_probe":"deepseek"}' \
          https://127.0.0.1/v1/chat/completions
        sleep 2
        grep -q '"host":"deepseek.llm.lan"' /var/log/nginx/llm-request.log
      args:
        executable: /bin/bash
      changed_when: false

    # The same check a browser performs: the served leaf must verify against
    # the LAN CA root (trusted on the client) and carry every SAN in the
    # domain list.
    - name: Verify the served leaf is signed by the LAN CA and carries all SANs
      ansible.builtin.shell: |
        set -euo pipefail
        echo | openssl s_client -connect 127.0.0.1:443 -servername app.taiga.lan \
          -CAfile {{ lan_ca_dir }}/ca.pem 2>/dev/null \
          | grep -q "Verify return code: 0 (ok)"
        SAN=$(echo | openssl s_client -connect 127.0.0.1:443 -servername app.taiga.lan 2>/dev/null \
          | openssl x509 -noout -ext subjectAltName | awk 'NR==2')
        for d in {{ lan_https_domains | join(' ') }}; do
            echo "$SAN" | grep -qE "DNS:${d}(,|$)"
        done
      changed_when: false

    - name: Verify the CA is published at /lan-ca.pem and matches the root
      ansible.builtin.shell: |
        set -euo pipefail
        # with the token the served root must match /etc/lan-ca/ca.pem ...
        curl -fs -H 'x-lan-ca-token: {{ lan_ca_token }}' \
          http://127.0.0.1/lan-ca.pem | cmp -s - /etc/lan-ca/ca.pem
        # ... and without it the endpoint must refuse (403)
        if curl -fs http://127.0.0.1/lan-ca.pem > /dev/null 2>&1; then
            echo "CA root is served without the token" >&2
            exit 1
        fi
      changed_when: false

    # --- Fluent Bit (JSON access log -> OpenSearch) -----------------------------
    - name: Stop and disable Filebeat (replaced by Fluent Bit)
      ansible.builtin.systemd:
        name: filebeat
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Filebeat package
      ansible.builtin.apt:
        name: filebeat
        state: absent

    - name: Remove the Elastic APT repository and key (no longer used)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/elastic.sources
        - /etc/apt/keyrings/elasticsearch.gpg

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Fluent Bit GPG key
      ansible.builtin.shell: |
        curl -fsSL https://packages.fluentbit.io/fluentbit.key | gpg --dearmor -o /etc/apt/keyrings/fluentbit.gpg
      args:
        creates: /etc/apt/keyrings/fluentbit.gpg

    - name: Add Fluent Bit APT repository (Ubuntu resolute)
      ansible.builtin.deb822_repository:
        name: fluentbit
        types: deb
        uris: https://packages.fluentbit.io/ubuntu/resolute
        suites: resolute
        components: [main]
        signed_by: /etc/apt/keyrings/fluentbit.gpg
        state: present

    # Hard-fail on update errors (the apt module can swallow them — see the
    # same task in modules/elk/ansible.yml for the incident this prevents).
    - name: Update apt cache (hard failure on error)
      ansible.builtin.shell: apt-get update -qq
      changed_when: false
      register: apt_update
      failed_when: apt_update.rc != 0

    - name: Install Fluent Bit
      ansible.builtin.apt:
        update_cache: false
        name:
          - fluent-bit
        state: present

    - name: Deploy Fluent Bit parsers
      ansible.builtin.copy:
        dest: /etc/fluent-bit/parsers.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ parsers_conf }}"

    - name: Deploy Fluent Bit configuration
      ansible.builtin.copy:
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: "0644"
        content: "{{ fluent_conf }}"

    - name: Deploy Fluent Bit service
      ansible.builtin.copy:
        dest: /etc/systemd/system/fluent-bit.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Fluent Bit (nginx access log shipper)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/fluent-bit.conf
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Create Fluent Bit state directory (tail offset DB)
      ansible.builtin.file:
        path: /var/lib/fluent-bit
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Enable and start Fluent Bit
      ansible.builtin.systemd:
        name: fluent-bit
        # restarted: picks up config changes on re-runs (started is a
        # no-op when the unit is already running)
        state: restarted
        enabled: true
        daemon_reload: true

    # Fluent Bit buffers and retries on output failure, so a late-starting
    # OpenSearch is not fatal — but wait for it here to get a clean first
    # run. On a fresh apply the ELK VM may still be provisioning (this play
    # can race the module.elk action trigger), hence the long timeout.
    - name: Wait for OpenSearch
      ansible.builtin.wait_for:
        host: "{{ elk_ip }}"
        port: 9200
        timeout: 900

    - name: Verify Fluent Bit is healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:2020/"
        status_code: 200
        timeout: 10
      register: fluent_health
      until: fluent_health.status == 200
      retries: 6
      delay: 5
      changed_when: false

  handlers:
    - name: restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
