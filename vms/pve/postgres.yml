---
- name: Install and configure PostgreSQL
  hosts: postgres
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # terraform passes the value via local-exec environment
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    lan_subnet: 192.168.51.0/24
    pg_port: 5432

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Fail early when POSTGRES_PASSWORD is not provided
      ansible.builtin.fail:
        msg: "Set the POSTGRES_PASSWORD environment variable (terraform passes it via local-exec)"
      when: postgres_password | length == 0

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: postgres

    - name: Install PostgreSQL
      ansible.builtin.apt:
        update_cache: true
        name:
          - postgresql
          - postgresql-contrib
        state: present

    - name: Detect installed PostgreSQL major version
      ansible.builtin.shell: ls /etc/postgresql
      register: pg_version
      changed_when: false

    - name: Listen on all interfaces (LAN access)
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"

    - name: Allow LAN clients (scram-sha-256)
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ pg_version.stdout }}/main/pg_hba.conf
        line: "host    all             all             {{ lan_subnet }}    scram-sha-256"
        insertafter: EOF

    # password passed as a psql variable (list-form command, no shell)
    # so special characters cannot break quoting
    - name: Set superuser password
      ansible.builtin.command:
        cmd:
          - psql
          - -v
          - "ON_ERROR_STOP=1"
          - -v
          - "pw={{ postgres_password }}"
          - -qc
          - "ALTER USER postgres WITH PASSWORD :'pw';"
      become_user: postgres
      no_log: true
      changed_when: true

    - name: Enable and start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Wait for PostgreSQL to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ pg_port }}"
        timeout: 120
