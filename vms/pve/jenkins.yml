---
- name: Configure Jenkins VM
  hosts: jenkins
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Jenkins GPG key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        timeout: 30

    - name: Add Jenkins APT repository
      ansible.builtin.deb822_repository:
        name: jenkins
        types:
          - deb
        uris:
          - https://pkg.jenkins.io/debian
        suites:
          - binary/
        signed_by: /etc/apt/keyrings/jenkins-keyring.asc
        state: present

    - name: Upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true

    - name: Install Jenkins dependencies
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
      register: jenkins_install

    - name: Ensure Jenkins service is enabled and started
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    - name: Set Jenkins web root to 0.0.0.0 (accessible from LAN)
      ansible.builtin.lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_ARGS='
        line: 'JENKINS_ARGS="--webroot=/var/cache/jenkins/war --httpListenAddress=0.0.0.0 --httpPort=8080"'
        create: true

    - name: Restart Jenkins to apply configuration
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
      when: jenkins_install.changed

    - name: Wait for Jenkins to respond
      ansible.builtin.uri:
        url: http://localhost:8080/login
        status_code: 200
        timeout: 60
      register: jenkins_check
      until: jenkins_check.status == 200
      retries: 12
      delay: 5
