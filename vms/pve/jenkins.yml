---
- name: Configure Jenkins controller VM (unattended bootstrap)
  hosts: jenkins
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # terraform passes the value via local-exec environment
    jenkins_admin_password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
    jenkins_home: /var/lib/jenkins
    jenkins_user_home: "{{ jenkins_home }}"
    jenkins_http_port: 8080
    jenkins_agent_host: 192.168.51.203
    jenkins_agent_user: jenkins
    jenkins_agent_ssh_key_path: /Users/ffhs/.ssh/jenkins-agent
    jenkins_agent_ssh_key: "{{ lookup('file', jenkins_agent_ssh_key_path) | trim }}"
    
    bootstrap_plugins:
      - configuration-as-code
      - credentials
      - credentials-binding
      - plain-credentials
      - git
      - git-client
      - github
      - github-api
      - github-branch-source
      - parameterized-trigger
      - pipeline-build-step
      - pipeline-github-lib
      - pipeline-graph-view
      - pipeline-groovy-lib
      - pipeline-input-step
      - pipeline-milestone-step
      - pipeline-model-api
      - pipeline-model-definition
      - pipeline-model-extensions
      - pipeline-stage-step
      - pipeline-stage-tags-metadata
      - pipeline-utility-steps
      - snakeyaml-api
      - ssh-agent
      - ssh-credentials
      - ssh-slaves
      - theme-manager
      - workflow-aggregator
      - workflow-api
      - workflow-basic-steps
      - workflow-cps
      - workflow-durable-task-step
      - workflow-job
      - workflow-multibranch
      - workflow-scm-step
      - workflow-step-api
      - workflow-support
      - ansicolor
      - timestamper
      - build-timeout
      - ws-cleanup
      - rebuild
      - email-ext
      - mailer
      - role-strategy

  tasks:
    - name: Wait for SSH (first boot)
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        cmd: cloud-init status --wait
      changed_when: false
      async: 300
      poll: 5

    - name: Gather facts
      ansible.builtin.setup:

    - name: Fail early when JENKINS_ADMIN_PASSWORD is not provided
      ansible.builtin.fail:
        msg: "Set the JENKINS_ADMIN_PASSWORD environment variable (terraform passes it via local-exec)"
      when: jenkins_admin_password | length == 0

    - name: Fail early when the agent SSH private key is empty
      ansible.builtin.fail:
        msg: "The agent SSH private key file is empty: {{ jenkins_agent_ssh_key_path }}"
      when: jenkins_agent_ssh_key | length == 0

    - name: Install prerequisites for repository and plugin bootstrap
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch Jenkins GPG key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        timeout: 30

    - name: Add Jenkins APT repository
      ansible.builtin.deb822_repository:
        name: jenkins
        types:
          - deb
        uris:
          - https://pkg.jenkins.io/debian
        suites:
          - binary/
        signed_by: /etc/apt/keyrings/jenkins-keyring.asc
        state: present

    - name: Upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true

    - name: Install Jenkins and dependencies
      ansible.builtin.apt:
        name:
          - fontconfig
          - openjdk-21-jre
          - jenkins
        state: present

#    - name: Expose Jenkins web UI on all interfaces (LAN access)
#      ansible.builtin.lineinfile:
#        path: /etc/default/jenkins
#        regexp: '^JENKINS_ARGS='
#        line: 'JENKINS_ARGS="--webroot=/var/cache/jenkins/war --httpListenAddress=0.0.0.0 --httpPort={{ jenkins_http_port }}"'
#        create: true
#        mode: "0644"
#
#    - name: Disable Jenkins setup wizard
#      ansible.builtin.lineinfile:
#        path: /etc/default/jenkins
#        regexp: '^JAVA_ARGS='
#        line: 'JAVA_ARGS="-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"'
#        create: true
#        mode: "0644"

    - name: Set OS hostname
      ansible.builtin.hostname:
        name: jenkins-server

    - name: Create .ssh directory for jenkins user
      ansible.builtin.file:
        path: "{{ jenkins_user_home }}/.ssh"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Deploy agent SSH private key to controller
      ansible.builtin.copy:
        dest: "{{ jenkins_user_home }}/.ssh/jenkins-agent"
        owner: jenkins
        group: jenkins
        mode: "0600"
        content: "{{ jenkins_agent_ssh_key }}\n"


    - name: Create SSH config for jenkins user (manual ssh convenience)
      ansible.builtin.copy:
        dest: "{{ jenkins_user_home }}/.ssh/config"
        owner: jenkins
        group: jenkins
        mode: "0600"
        content: |
          Host jenkins-agent
              HostName {{ jenkins_agent_host }}
              User {{ jenkins_agent_user }}
              IdentityFile {{ jenkins_user_home }}/.ssh/jenkins-agent
              StrictHostKeyChecking accept-new

    - name: Stop Jenkins (package postinst may have started it already)
      ansible.builtin.systemd:
        name: jenkins
        state: stopped

    - name: Ensure Groovy init directory exists
      ansible.builtin.file:
        path: "{{ jenkins_home }}/init.groovy.d"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Bootstrap admin user via Groovy init script (runs before plugins)
      ansible.builtin.copy:
        dest: "{{ jenkins_home }}/init.groovy.d/01-create-admin.groovy"
        owner: jenkins
        group: jenkins
        mode: "0644"
        content: |
          import jenkins.model.*
          import hudson.security.*
          
          def instance = Jenkins.getInstance()
          def hudsonRealm = new HudsonPrivateSecurityRealm(false)
          
          hudsonRealm.createAccount("admin", "{{ jenkins_admin_password }}")
          instance.setSecurityRealm(hudsonRealm)
          
          def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
          strategy.setAllowAnonymousRead(false)
          instance.setAuthorizationStrategy(strategy)
          instance.save()


    - name: Start Jenkins (Initial boot with Groovy admin creation)
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins API with admin credentials (proves Groovy script worked)
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/api/json?tree=jenkinsVersion"
        user: admin
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: 200
        timeout: 10
      register: api_check
      until: api_check.status == 200
      retries: 48
      delay: 10
      changed_when: false


    - name: Check which bootstrap plugins are already installed (.jpi)
      ansible.builtin.stat:
        path: "{{ jenkins_home }}/plugins/{{ item }}.jpi"
      loop: "{{ bootstrap_plugins }}"
      register: plugin_jpi_files
      changed_when: false

    - name: Check which bootstrap plugins are already installed (.hpi)
      ansible.builtin.stat:
        path: "{{ jenkins_home }}/plugins/{{ item }}.hpi"
      loop: "{{ bootstrap_plugins }}"
      register: plugin_hpi_files
      changed_when: false

    - name: Determine which bootstrap plugins are missing
      ansible.builtin.set_fact:
        missing_plugins: "{{ bootstrap_plugins | difference((plugin_jpi_files.results | selectattr('stat.exists') | map(attribute='item') | list) + (plugin_hpi_files.results | selectattr('stat.exists') | map(attribute='item') | list)) }}"

    - name: Install missing bootstrap plugins (crumb + cookie session via curl)
      ansible.builtin.shell: |
        set -euo pipefail
        CJ=$(mktemp)
        trap 'rm -f "$CJ"' EXIT
        CRUMB=$(curl -fsS -m 30 -c "$CJ" -b "$CJ" -u "admin:$JENKINS_ADMIN_PASSWORD" \
          "http://localhost:{{ jenkins_http_port }}/crumbIssuer/api/json" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["crumb"])')
        curl -fsS -m 900 -c "$CJ" -b "$CJ" -u "admin:$JENKINS_ADMIN_PASSWORD" \
          -H "Jenkins-Crumb: $CRUMB" \
          -H "Content-Type: application/json" \
          -X POST "http://localhost:{{ jenkins_http_port }}/pluginManager/installPlugins" \
          -d '{"dynamicLoad": false, "plugins": {{ missing_plugins | to_json }}}'
      args:
        executable: /bin/bash
      environment:
        JENKINS_ADMIN_PASSWORD: "{{ jenkins_admin_password }}"
      when: missing_plugins | length > 0


    - name: Wait for plugin installation to finish (.jpi or .hpi files present)
      ansible.builtin.shell: |
        set -euo pipefail
        for p in {{ missing_plugins | join(' ') }}; do
          if [ ! -e "{{ jenkins_home }}/plugins/$p.jpi" ] && [ ! -e "{{ jenkins_home }}/plugins/$p.hpi" ]; then
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      register: plugins_ready
      until: plugins_ready.rc == 0
      retries: 10
      delay: 60
      changed_when: false
      when: missing_plugins | length > 0

#    - name: Reset systemd failed state for Jenkins (clears crash loop lockouts)
#      ansible.builtin.command:
#        cmd: systemctl reset-failed jenkins.service
#      changed_when: false
#      failed_when: false
#
#    - name: Restart Jenkins to load the new plugins (including Configuration-as-Code)
#      ansible.builtin.systemd:
#        name: jenkins
#        state: restarted
#      when: missing_plugins | length > 0
#
#    - name: Wait a moment for Jenkins to begin startup sequence
#      ansible.builtin.pause:
#        seconds: 60
#      when: missing_plugins | length > 0

    - name: Wait for Jenkins to be running after installing plugins
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/api/json?tree=jenkinsVersion"
        user: admin
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: 200
        timeout: 30
      register: back_up
      until: back_up.status == 200
      retries: 60
      delay: 10
      changed_when: false
      when: missing_plugins | length > 0


    - name: Seed Configuration-as-Code file (applied automatically on next restart)
      ansible.builtin.copy:
        dest: "{{ jenkins_home }}/jenkins.yaml"
        owner: jenkins
        group: jenkins
        mode: "0600"
        content: |
          jenkins:
            numExecutors: 0
            securityRealm:
              local:
                allowsSignup: false
                users:
                  - id: "admin"
                    name: "Administrator"
                    password: "{{ jenkins_admin_password }}"
            authorizationStrategy:
              loggedInUsersCanDoAnything:
                allowAnonymousRead: false
            nodes:
              - permanent:
                  name: jenkins-agent
                  remoteFS: /home/jenkins
                  # FIX: 'labelString' instead of 'label'
                  labelString: "jenkins-agent"
                  numExecutors: 4
                  mode: NORMAL
                  launcher:
                    ssh:
                      host: {{ jenkins_agent_host }}
                      port: 22
                      credentialsId: jenkins-agent
                      launchTimeoutSeconds: 60
                      maxNumRetries: 10
                      retryWaitTime: 15
                      tcpNoDelay: true
                      workDir: /home/jenkins
                      sshHostKeyVerificationStrategy:
                        nonVerifyingKeyVerificationStrategy: {}
          credentials:
            system:
              domainCredentials:
                - credentials:
                    - basicSSHUserPrivateKey:
                        scope: SYSTEM
                        id: jenkins-agent
                        username: {{ jenkins_agent_user }}
                        description: "SSH key for jenkins-agent ({{ jenkins_agent_host }})"
                        privateKeySource:
                          directEntry:
                            privateKey: |
          {{ jenkins_agent_ssh_key | trim | indent(30, first=True) }}

    - name: Create Jenkins systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Jenkins via systemd override (wizard off + LAN binding)
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_ARGS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
          Environment="JENKINS_ARGS=--webroot=/var/cache/jenkins/war --httpListenAddress=0.0.0.0 --httpPort={{ jenkins_http_port }}"

    - name: Reload systemd to apply Jenkins override
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Wait a moment for JCasC to process
      ansible.builtin.pause:
        seconds: 60

    - name: Wait for Jenkins API to be accessible
      ansible.builtin.uri:
        url: "http://localhost:{{ jenkins_http_port }}/api/json"
        user: admin
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: 200
        timeout: 10
      register: jenkins_ready
      until: jenkins_ready.status == 200
      retries: 48
      delay: 10
      changed_when: false

    - name: Get CSRF crumb and complete wizard installation
      ansible.builtin.shell: |
        set -euo pipefail
        CJ=$(mktemp)
        trap 'rm -f "$CJ"' EXIT
        CRUMB=$(curl -fsS -m 30 -c "$CJ" -b "$CJ" -u "admin:{{ jenkins_admin_password }}" \
          "http://localhost:{{ jenkins_http_port }}/crumbIssuer/api/json" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["crumb"])')
        
        # Complete the installation (skips plugin install + user creation screens)
        curl -fsS -m 30 -b "$CJ" -u "admin:{{ jenkins_admin_password }}" \
          -H "Jenkins-Crumb: $CRUMB" \
          -X POST "http://localhost:{{ jenkins_http_port }}/setupWizard/completeInstall"
      args:
        executable: /bin/bash

    - name: Final restart to apply JCasC configuration
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
    
